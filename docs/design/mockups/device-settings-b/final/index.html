<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Más · Configuración · Lo tuyo · final</title>
<link rel="stylesheet" href="../../../common/common.css">
<link rel="stylesheet" href="settings.css">
<script src="../../../common/icons.js"></script>
<script src="icons-extra.js"></script>
</head>
<body>
<div class="prueba" aria-hidden="true">
  <div class="prueba-borde"></div>
  <div class="prueba-cartel">Ambiente de prueba<span> · nada de esto es real</span></div>
</div>

<div class="app">
  <!-- ======== Computadora: el lateral, con la tarjeta del vínculo al pie ======== -->
  <nav class="lateral solo-compu" aria-label="Menú">
    <div class="lado-marca"><img src="../../../common/brand/logo-on-light.png" alt="Ferrebress" width="141" height="36"><button type="button" class="btn btn-fantasma lado-plegar" aria-label="Minimizar el menú"><i class="i" data-i="panel-left-close"></i></button></div>
    <button type="button" class="nav-item"><i class="i" data-i="shopping-cart"></i><span class="txt">Vender</span></button>
    <button type="button" class="nav-item"><i class="i" data-i="tags"></i><span class="txt">Catálogo</span></button>
    <button type="button" class="nav-item"><i class="i" data-i="package"></i><span class="txt">Depósito</span></button>
    <button type="button" class="nav-item"><i class="i" data-i="chart-column"></i><span class="txt">Negocio</span></button>
    <button type="button" class="nav-item" aria-current="page"><i class="i" data-i="ellipsis"></i><span class="txt">Más</span></button>
    <div class="pie">
      <div class="vinculo-tarjeta">
        <!-- El indicador nombra al celular con su nombre (R9.4) -->
        <button type="button" class="indicador" data-indicador aria-haspopup="dialog" aria-label="Vínculo con el celular">
          <span class="indicador-ico"><i class="i" data-i="smartphone"></i><span class="dot"></span></span>
          <span class="indicador-txt"><b>Directo</b><small data-nombre-de="celu-ruben">Celu de Rubén</small></span>
          <span class="kbd">L</span>
        </button>
        <div class="luz" data-luz><span class="punto"></span><span data-luz-txt>En línea · todo enviado</span></div>
        <p class="gasto-app">Aplicación: <b>0 KB/min</b></p>
      </div>
      <div class="persona"><div class="usuario"><span class="avatar">RP</span><div><b class="persona-nombre">Rubén Paredes</b><div class="t-detalle">Administrador</div></div></div><button type="button" class="btn chico"><i class="i i-s" data-i="log-out"></i>Salir</button></div>
    </div>
  </nav>

  <main class="contenido">
    <header class="cabecera">
      <nav class="migas t-detalle solo-compu" aria-label="Dónde estoy"><button type="button">Más</button><i class="i i-s" data-i="chevron-right"></i><span>Configuración</span></nav>
      <button type="button" class="volver solo-celu"><i class="i" data-i="chevron-left"></i>Más</button>
      <h1 class="t-titulo">Configuración</h1>
      <!-- «Volver a como viene» (R1.11): solo si algo cambió -->
      <button type="button" class="btn btn-fantasma chico como-viene" data-reset hidden><i class="i i-s" data-i="rotate-ccw"></i><span class="largo">Volver a como viene</span><span class="corto">Como viene</span><span class="kbd">O</span></button>

      <!-- Celular: la pastilla del vínculo debajo del título; la luz, a su lado, solo sin conexión (00 · R4.1) -->
      <div class="p-estado solo-celu">
        <button type="button" class="indicador-pastilla" data-indicador aria-haspopup="dialog" aria-label="Vínculo: Directo"><i class="i i-s" data-i="monitor"></i><span class="dot"></span><span class="pastilla-txt"><b>Directo</b><span class="pastilla-gasto"><b>0 KB/min</b></span></span></button>
        <span class="p-luz sin-red-pastilla"><span class="punto"></span>Sin conexión · 0 por enviar</span>
      </div>

      <div class="sub-pantalla">
        <span class="para-vos"><span class="cara" aria-hidden="true">RP</span><span>Solo para vos, en <span class="largo">esta computadora</span><span class="corto">este celular</span></span></span>
        <!-- «Así la tenés» (R1.10) -->
        <div class="asi" role="group" aria-labelledby="asi-titulo"><span class="t-etiqueta" id="asi-titulo">Así la tenés:</span><div class="asi-pastillas" data-asi></div></div>
      </div>
    </header>

    <section class="pantalla" aria-label="Configuración">
      <!-- Este dispositivo: el dibujo con su nombre, su huella, lo que hizo entrar y sus preferencias (R1.8) -->
      <div class="col-este" data-este></div>

      <!-- Los otros dispositivos propios, cada uno con su sesión y su huella, y lo que hizo entrar colgado (R1.8, R6 a R8) -->
      <section class="col-otros" aria-labelledby="otros-titulo">
        <div class="otros-cab">
          <h2 class="t-seccion" id="otros-titulo">Tus otros dispositivos</h2>
          <span class="pastilla urgente sin-red-pastilla"><i class="i i-s" data-i="wifi-off"></i>Sin conexión</span>
        </div>
        <div class="del-servidor" data-otros></div>
      </section>
    </section>
  </main>

  <nav class="nav-inferior solo-celu" aria-label="Menú">
    <button type="button"><i class="i" data-i="shopping-cart"></i>Vender</button>
    <button type="button"><i class="i" data-i="tags"></i>Catálogo</button>
    <button type="button"><i class="i" data-i="package"></i>Depósito</button>
    <button type="button"><i class="i" data-i="chart-column"></i>Negocio</button>
    <button type="button" aria-current="page"><i class="i" data-i="menu"></i>Más</button>
  </nav>
</div>
<script src="settings.js"></script>
</body>
</html>
