<div class="prueba" aria-hidden="true"><div class="prueba-borde"></div><div class="prueba-cartel">Ambiente de prueba<span> · nada de esto es real</span></div></div>

<div class="app">
  <nav class="lateral solo-compu" aria-label="Menú">
    <div class="lado-marca"><img src="../../../../common/brand/logo-on-light.png" alt="Ferrebress" width="141" height="36"><button type="button" class="btn btn-fantasma lado-plegar" aria-label="Minimizar el menú"><i class="i" data-i="panel-left-close"></i></button></div>
    <button type="button" class="nav-item" data-ir="sales"><i class="i" data-i="shopping-cart"></i><span class="txt">Vender</span></button>
    <button type="button" class="nav-item" data-ir="products"><i class="i" data-i="tags"></i><span class="txt">Catálogo</span></button>
    <button type="button" class="nav-item" data-ir="stock"><i class="i" data-i="package"></i><span class="txt">Depósito</span></button>
    <button type="button" class="nav-item" data-ir="business-overview"><i class="i" data-i="chart-column"></i><span class="txt">Negocio</span></button>
    <button type="button" class="nav-item" aria-current="page" data-ir="more"><i class="i" data-i="ellipsis"></i><span class="txt">Más</span></button>
    <div class="pie">
      <div class="vinculo-tarjeta">
        <button type="button" class="indicador" data-indicador aria-label="Vínculo con el celular">
          <span class="indicador-ico"><i class="i" data-i="smartphone"></i><span class="dot"></span></span>
          <span class="indicador-txt"><b>Directo</b><small data-nombre-de="celu-ruben">Celu de Rubén</small></span>
          <span class="kbd">L</span>
        </button>
        <div class="luz" data-luz><span class="punto"></span><span data-luz-txt>En línea · todo enviado</span></div>
      </div>
      <div class="persona"><div class="usuario"><span class="avatar">RP</span><div><b class="persona-nombre">Rubén Paredes</b><div class="t-detalle">Administrador</div></div></div><button type="button" class="btn chico" data-ir="sign-in"><i class="i i-s" data-i="log-out"></i>Salir</button></div>
    </div>
  </nav>

  <main class="contenido">
    <header class="cabecera">
      <nav class="migas t-detalle solo-compu" aria-label="Dónde estoy"><button type="button" data-ir="more">Más</button><i class="i i-s" data-i="chevron-right"></i><span>Configuración</span></nav>
      <button type="button" class="volver solo-celu" data-ir="more"><i class="i" data-i="chevron-left"></i>Más</button>
      <h1 class="t-titulo">Configuración</h1>
      <div class="p-estado solo-celu">
        <button type="button" class="indicador-pastilla" data-indicador><i class="i i-s" data-i="monitor"></i><span class="dot"></span>Directo</button>
        <span class="pastilla urgente sin-red-pastilla"><i class="i i-s" data-i="wifi-off"></i>Sin conexión</span>
      </div>
      <div class="sub-pantalla">
        <span class="para-vos"><span class="cara" aria-hidden="true">RP</span><span>Solo para vos, en <span class="largo">esta computadora</span><span class="corto">este celular</span></span></span>
        <div class="asi"><span class="t-etiqueta solo-compu">Así la tenés:</span><div class="asi-pastillas" data-asi></div></div>
      </div>
    </header>

    <section class="pantalla v2" aria-label="Configuración">
      <div class="col-este" data-este></div>
      <section class="col-otros" aria-labelledby="otros-titulo">
        <div class="otros-cab">
          <h2 class="t-seccion" id="otros-titulo"><span class="largo">Tus otros dispositivos</span><span class="corto">Tus otros dispositivos</span></h2>
          <span class="pastilla urgente sin-red-pastilla"><i class="i i-s" data-i="wifi-off"></i>Sin conexión</span>

        <div class="del-servidor" data-otros></div>
      </section>
    </section>

  <nav class="nav-inferior solo-celu" aria-label="Menú">
    <button type="button" data-ir="sales"><i class="i" data-i="shopping-cart"></i>Vender</button>
    <button type="button" data-ir="products"><i class="i" data-i="tags"></i>Catálogo</button>
    <button type="button" data-ir="stock"><i class="i" data-i="package"></i>Depósito</button>
    <button type="button" data-ir="business-overview"><i class="i" data-i="chart-column"></i>Negocio</button>
    <button type="button" aria-current="page" data-ir="more"><i class="i" data-i="menu"></i>Más</button>
