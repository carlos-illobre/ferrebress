<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · 2 · Personas y aparatos · computadora</title>
<link rel="stylesheet" href="../../../../common/common.css">
<link rel="stylesheet" href="../../shared/frame.css">
<script src="../../../../common/icons.js"></script>
<script src="../../shared/icons-extra.js"></script>
<script src="../../../../common/navigate.js" defer></script>
<style>
  .pantalla { display: flex; flex-direction: column; gap: 16px; padding-top: 20px; padding-bottom: 0; overflow: hidden; position: relative; }
  .segmentos .n { color: var(--texto-3); font-weight: 650; }
  .segmentos > * { min-height: 38px; font-size: 15px; }
  .segmentos .kbd { height: 22px; min-width: 22px; }

  /* Autorizar: una línea, como agregar una tarea en Linear */
  #compo { display: grid; grid-template-columns: 44px minmax(0,1.3fr) minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 12px 12px 16px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-2); transition: box-shadow var(--t) var(--curva); flex: none; }
  #compo:focus-within { box-shadow: 0 0 0 4px rgba(18,56,47,.10), var(--sombra-2); border-color: var(--pino); }
  .mas { width: 44px; height: 44px; border-radius: 99px; background: var(--accion-suave); color: var(--accion-texto); display: grid; place-items: center; }
  #compo input { height: 44px; border: 0; outline: 0; background: var(--hundido); border-radius: 10px; padding: 0 14px; font-size: 16px; font-weight: 650; width: 100%; }
  #compo input:focus { background: var(--superficie); box-shadow: inset 0 0 0 1px var(--borde-fuerte); }
  #compo .nombre-op { opacity: .55; transition: opacity var(--t); }
  #compo.lleno .nombre-op, #compo .nombre-op:focus { opacity: 1; }
  #compo .err { grid-column: 2 / -1; display: none; align-items: center; gap: 6px; font-size: 14px; font-weight: 650; color: var(--error-texto); margin-top: -4px; }
  #compo.mal .err { display: flex; }
  #compo.mal #c-correo { box-shadow: inset 0 0 0 2px var(--error); background: var(--error-suave); }
  #compo .ayuda { grid-column: 2 / -1; font-size: 14px; color: var(--texto-3); margin-top: -4px; }
  #compo.mal .ayuda { display: none; }

  #vista { flex: 1; min-height: 0; overflow: auto; margin: 0 -8px; padding: 0 8px 24px; }
  .cambia { animation: fundido var(--t) var(--curva); }
  @keyframes fundido { from { opacity: 0; } to { opacity: 1; } }

  .pases { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; align-items: start; }
  .pase { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1); padding: 14px; display: grid; gap: 12px; }
  .pase.nunca { border-style: dashed; border-color: var(--borde-fuerte); }
  .pase-cab { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; }
  .a48 { width: 48px; height: 48px; font-size: 16px; }
  .a32 { width: 32px; height: 32px; }
  .a28 { width: 28px; height: 28px; font-size: 14px; }
  .pq { display: grid; min-width: 0; }
  .pq b { font-size: 16px; line-height: 22px; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pq b .pastilla { height: 24px; padding: 0 8px; }
  .pq > span { font-size: 14px; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-icono.chico { width: 36px; color: var(--texto-2); }
  .pase-linea { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .pase-linea .pastilla { height: 26px; }
  .ult { font-size: 14px; font-weight: 600; color: var(--texto-2); }
  .ult.nu { color: var(--urgente-texto); }
  .dock { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; border-top: 1px solid var(--borde); }
  .tile { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 6px; border-radius: 12px; border: 1px solid var(--borde); background: var(--fondo); text-align: left; transition: transform var(--t-micro) var(--curva), border-color var(--t-micro); }
  .tile:hover { border-color: var(--borde-fuerte); }
  .tile:active { transform: scale(.96); }
  .tile .ti { width: 36px; height: 36px; border-radius: 9px; background: var(--superficie); display: grid; place-items: center; color: var(--texto-2); position: relative; box-shadow: var(--sombra-1); }
  .tile.huella .ti { color: var(--pino-texto); background: var(--pino-suave); box-shadow: none; }
  .vivo { position: absolute; right: -3px; top: -3px; width: 12px; height: 12px; border-radius: 99px; background: var(--logro); border: 2px solid #fff; }
  .tile .tt { display: grid; line-height: 18px; }
  .tile .tt b { font-size: 14px; }
  .tile .tt span { font-size: 14px; color: var(--texto-2); font-weight: 500; }
  .sin { font-size: 14px; color: var(--texto-3); align-self: center; }
  .nota-vos { width: 100%; }
  .estrenar { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--urgente-suave); color: var(--urgente-texto); font-size: 14px; line-height: 20px; font-weight: 600; }
  .pase-pie { display: flex; gap: 8px; }

  .estante { margin-top: 24px; padding: 14px 16px; border-radius: var(--r-tarjeta); background: var(--hundido); }
  .est-cab { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--texto-2); margin-bottom: 12px; }
  .est-cab .t-detalle { margin-left: auto; font-weight: 500; }
  .est-fila { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .ficha-baja { display: grid; grid-template-columns: 32px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--borde-fuerte); }
  .fb { display: grid; min-width: 0; }
  .fb b { font-size: 15px; color: var(--texto-2); }
  .fb span { font-size: 14px; color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Aparatos */
  .aparatos { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 24px; align-items: start; }
  .grupo { font-size: 14px; font-weight: 700; color: var(--texto-2); padding: 0 4px 8px; }
  .grupo:not(:first-child) { padding-top: 16px; }
  .ap { display: grid; grid-template-columns: 40px minmax(0,1fr) 190px 96px auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1); }
  .ap + .ap { margin-top: 8px; }
  .ap .ti { width: 40px; height: 40px; border-radius: 10px; background: var(--hundido); display: grid; place-items: center; color: var(--texto-2); position: relative; }
  .apt { display: grid; min-width: 0; }
  .apt b { font-size: 15px; line-height: 20px; }
  .apt span { font-size: 14px; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .duenio { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 650; min-width: 0; }
  .duenio span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uso { font-size: 14px; color: var(--texto-2); font-weight: 600; }
  .chico-ap { grid-template-columns: 40px minmax(0,1fr) auto; }
  .chico-ap .ti { background: var(--pino-suave); color: var(--pino-texto); }
  .ap-lado { display: grid; gap: 16px; }
  .perdido { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-tarjeta); background: var(--superficie); border: 1px solid var(--borde); box-shadow: var(--sombra-2); }
  .perdido > div { display: grid; gap: 4px; }
  .perdido b { font-size: 16px; }
  .perdido span { font-size: 14px; color: var(--texto-2); line-height: 20px; }
  .ico-p { width: 48px; height: 48px; border-radius: 14px; background: var(--hundido); display: grid; place-items: center; color: var(--tinta); }
  .perdido { grid-template-columns: 48px 1fr; }
  .perdido .btn { grid-column: 1 / -1; }

  /* Globo del aparato y menú */
  #globo, #menu { position: fixed; z-index: 30; width: 320px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-3); opacity: 0; transform: translateY(-4px) scale(.98); transform-origin: top left; pointer-events: none; transition: opacity var(--t) var(--curva), transform var(--t) var(--curva); }
  #globo.abierto, #menu.abierto { opacity: 1; transform: none; pointer-events: auto; }
  .g-in { padding: 14px; display: grid; gap: 12px; }
  .g-cab { display: flex; gap: 12px; align-items: center; }
  .g-cab .ti { width: 40px; height: 40px; border-radius: 10px; background: var(--hundido); display: grid; place-items: center; }
  .g-cab div { display: grid; }
  .g-cab span { font-size: 14px; color: var(--texto-2); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
  dt { color: var(--texto-2); font-weight: 600; } dd { margin: 0; font-weight: 650; }
  #menu { width: 300px; padding: 6px; transform-origin: top right; }
  #menu button { display: flex; width: 100%; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: none; font-weight: 650; font-size: 15px; text-align: left; }
  #menu button:hover { background: var(--hundido); }
  #menu button.rojo { color: var(--error-texto); }
  .m-nota { display: flex; gap: 8px; align-items: center; padding: 6px 12px 8px; font-size: 14px; color: var(--texto-3); }

  .dialogo .lead { margin: 4px 0 0; color: var(--texto-2); font-size: 15px; }
  #editar { display: grid; gap: 16px; }
  #editar input:disabled { background: var(--hundido); color: var(--texto-2); box-shadow: none; }
  .quienes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
  .quien-b { display: grid; grid-template-columns: 48px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left; padding: 12px; border-radius: var(--r); border: 1px solid var(--borde); background: var(--superficie); transition: transform var(--t-micro) var(--curva), border-color var(--t-micro); }
  .quien-b:hover { border-color: var(--pino); }
  .quien-b:active { transform: scale(.97); }
  .quien-b .avatar { grid-row: span 2; }
  .quien-b span { font-size: 14px; color: var(--texto-2); }
  #perdido { width: 560px; }
  body[data-vista=aparatos] #compo { display: none; }
  .gris-cartel { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 5; }
</style>
</head>
<body data-vista="personas">
<div class="app">
  <nav class="lateral">
    <div class="lado-marca"><img src="../../../../common/brand/logo-on-light.png" alt="Ferrebress" width="141" height="36"><button class="btn btn-fantasma" aria-label="Minimizar el menú"><i class="i" data-i="panel-left-close"></i></button></div>
    <a class="nav-item" data-ir="sales"><i class="i" data-i="shopping-cart"></i><span class="txt">Vender</span></a>
    <a class="nav-item" data-ir="products"><i class="i" data-i="tags"></i><span class="txt">Catálogo</span></a>
    <a class="nav-item" data-ir="stock"><i class="i" data-i="package"></i><span class="txt">Depósito</span></a>
    <a class="nav-item activo" data-ir="business-overview"><i class="i" data-i="chart-column"></i><span class="txt">Negocio</span></a>
    <a class="nav-item" data-ir="more"><i class="i" data-i="ellipsis"></i><span class="txt">Más</span></a>
    <div class="pie">
      <button class="luz" data-luz title="En la maqueta: tocala para simular que se corta la conexión"><span class="punto"></span><span data-luz-texto>En línea · todo enviado</span><i class="i i-s" data-i="chevron-right"></i></button>
      <div class="persona"><div class="usuario"><span class="avatar">RP</span><div class="txt"><div style="font-weight:750;font-size:15px">Rubén Paredes</div><div class="t-detalle">Administrador</div></div></div><button class="btn chico" data-ir="sign-in"><i class="i i-s" data-i="log-out"></i>Salir</button></div>
    </div>
  </nav>
  <main class="contenido">
    <header class="cabecera">
      <div class="t-titulo">Negocio</div>
      <div class="acciones">
        <div class="segmentos zona-red" role="tablist">
          <button class="elegido" data-vista="personas"><i class="i i-s" data-i="users"></i>Personas <span class="n" data-n="personas">7</span> <span class="kbd">Alt 1</span></button>
          <button data-vista="aparatos"><i class="i i-s" data-i="tablet-smartphone"></i>Aparatos abiertos <span class="n" data-n="aparatos">8</span> <span class="kbd">Alt 2</span></button>
        </div>
      </div>
    </header>
    <nav class="pestanas"><a data-ir="business-overview">Resumen</a><a class="activa" data-no-ir>Usuarios</a><a data-ir="audit-log">Quién hizo qué</a></nav>
    <section class="pantalla">
      <div class="gris-cartel"><i class="i i-s" data-i="wifi-off"></i>Sin conexión <small>· se ve lo último, vuelve sola</small></div>
      <form id="compo" class="zona-red" novalidate>
        <span class="mas"><i class="i" data-i="user-plus"></i></span>
        <input id="c-correo" placeholder="Autorizá a alguien: escribí su correo de Google" autocomplete="off" aria-label="Correo de Google">
        <input id="c-nombre" class="nombre-op" placeholder="Nombre (opcional)" autocomplete="off" aria-label="Nombre">
        <button class="btn btn-accion" type="submit">Autorizar <span class="kbd">Enter</span></button>
        <div class="err"><i class="i i-s" data-i="circle-alert"></i><span></span></div>
        <div class="ayuda"><span class="kbd" style="height:22px">Alt N</span> desde cualquier lado. Cualquier dominio de Google. No le llega nada: avisale vos.</div>
      </form>
      <div id="vista" class="zona-red"></div>
    </section>
  </main>
</div>

<div id="globo"><div class="g-in"></div></div>
<div id="menu"></div>
<div class="velo"></div>
<form class="dialogo" id="editar" novalidate>
  <div><h2>Cambiar los datos</h2></div>
  <div class="campo-real"><label for="e-nombre">Nombre</label><input id="e-nombre" autocomplete="off"></div>
  <div class="campo-real cor"><label for="e-correo">Correo de Google</label><input id="e-correo" autocomplete="off"><div class="err"><i class="i i-s" data-i="circle-alert"></i><span></span></div><div class="ayuda"></div></div>
  <div class="pie-d" style="margin-top:0"><button type="button" class="btn btn-fantasma" data-cerrar>Cancelar</button><button class="btn btn-oscuro" type="submit">Guardar <span class="kbd">Enter</span></button></div>
</form>
<div class="dialogo" id="confirmar" role="alertdialog">
  <h2></h2><p class="lead"></p><ul class="consecuencias"></ul>
  <div class="pie-d"><button class="btn btn-fantasma" data-cerrar>No <span class="kbd claro">Esc</span></button><button class="btn btn-rojo"></button></div>
</div>
<div class="dialogo" id="perdido"><div class="paso"></div></div>
<div class="tostadas"></div>

<script src="../../shared/data.js"></script>
<script src="../../shared/ui.js"></script>
<script src="../../shared/v2.js"></script>
</body>
</html>
