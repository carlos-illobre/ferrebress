<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios · 3 · El tablero · celular</title>
<link rel="stylesheet" href="../../../../common/common.css">
<link rel="stylesheet" href="../../shared/frame.css">
<link rel="stylesheet" href="../../shared/v3.css">
<script src="../../../../common/icons.js"></script>
<script src="../../shared/icons-extra.js"></script>
<script src="../../../../common/navigate.js" defer></script>
<style>
  body { width: 390px; }
  .top { padding: 4px 16px 12px; flex-wrap: wrap; row-gap: 8px; }
  .top .salir { width: 44px; height: 44px; }
  .top .pq { flex: 1; min-width: 0; }
  .top .sub { line-height: 18px; }
  .ll-t { white-space: nowrap; }
  .vacio-r.nota { display: none; }
  .sin-estrenar > span { flex: 1; min-width: 200px; }
  .zona { flex: 1; min-height: 0; overflow: auto; padding: 0 12px 16px; }
  #tablero { border-radius: 20px; }
  .circuito { grid-template-columns: minmax(0,1fr) 72px; grid-template-areas: "placa llave" "riel riel"; padding: 8px 8px 4px; }
  .placa { grid-area: placa; min-width: 0; }
  .llave-z { grid-area: llave; }
  .riel { grid-area: riel; overflow-x: auto; scrollbar-width: none; padding: 8px 4px 10px; }
  .riel::before { left: 4px; right: 4px; }
  .cil { width: 48px; height: 48px; }
  .pl .pl-lin { flex-wrap: wrap; row-gap: 4px; }
  .termica { width: 100px; flex: none; }
  .general { width: 92px; flex: none; }
  .sin-estrenar { flex-wrap: wrap; }
  .sin-estrenar .btn { margin-left: 0; min-height: 40px; }
  .tarjeta-bloqueo { max-width: none; }
  .circuito.vacio { grid-template-columns: 1fr; grid-template-areas: none; padding: 12px; gap: 10px; }
  .campos input { height: 44px; }
  .nuevo-pie { flex-wrap: wrap; }
  .nuevo-pie .btn { min-height: 48px; }
  .divisor { padding: 12px 16px 8px; }
  .abajo-barra { padding: 10px 16px 24px; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--borde); flex: none; }
  .gris-cartel { position: absolute; top: 52px; }
  .hoja { display: grid; gap: 12px; }
  .hoja .pie-d { display: grid; grid-template-columns: 1fr 1.4fr; }
  .hoja .pie-d .btn { min-height: 52px; }
</style>
</head>
<body class="es-celu">
<div class="celu">
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#1A1D1B" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#1A1D1B"/></svg></span></div>
  <header class="top">
    <button class="btn btn-icono salir" data-ir="business-overview" aria-label="Volver a Negocio"><i class="i i-l" data-i="x"></i></button>
    <div class="pq"><span class="t-titulo">Usuarios</span><span class="sub"><b data-n="act">7</b> pueden entrar · <b data-n="ses">8</b> sesiones · <b data-n="hu">3</b> huellas</span></div>
    <button class="luz3" data-luz><span class="punto"></span><span data-luz-texto>En línea</span></button>
  </header>
  <div class="gris-cartel"><i class="i i-s" data-i="wifi-off"></i>Sin conexión</div>
  <div class="zona zona-red"><div id="tablero"></div></div>
  <div class="abajo-barra zona-red"><button class="btn btn-accion grande" style="width:100%" onclick="document.getElementById('nuevo').scrollIntoView({block:'center',behavior:'smooth'});setTimeout(function(){document.getElementById('n-correo').focus()},300)"><i class="i" data-i="user-plus"></i>Circuito nuevo</button></div>
  <span class="home-ind"></span>

  <div class="velo"></div>
  <form class="hoja" id="editar" novalidate>
    <div class="asa"></div><h2>La placa</h2>
    <div class="campo-real"><label for="e-nombre">Nombre</label><input id="e-nombre" autocomplete="off"></div>
    <div class="campo-real cor"><label for="e-correo">Correo de Google</label><input id="e-correo" autocomplete="off"><div class="err"><i class="i i-s" data-i="circle-alert"></i><span></span></div><div class="ayuda"></div></div>
    <div class="pie-d"><button type="button" class="btn btn-fantasma" data-cerrar>Cancelar</button><button class="btn btn-oscuro" type="submit">Guardar</button></div>
  </form>
  <div class="tostadas"></div>
</div>
<script src="../../shared/data.js"></script>
<script src="../../shared/ui.js"></script>
<script src="../../shared/v3.js"></script>
</body>
</html>
