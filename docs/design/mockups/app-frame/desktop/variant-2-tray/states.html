.app2 { display: grid; grid-template-columns: 88px 1fr; height: 768px; }

.parte .i { width: 24px; height: 24px; }

.cab2 { display: flex; align-items: center; gap: 16px; padding: 20px 32px 0; }
.cab2 .segmentos > * { min-height: 40px; font-size: 15px; padding: 0 16px; cursor: pointer; }
.cab2 .segmentos .p-pronto { height: 20px; }
.cab2 .der { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.luz2 { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px 0 12px; border-radius: 99px; border: 1px solid var(--borde); background: var(--superficie); box-shadow: var(--sombra-1); font-weight: 700; font-size: 15px; color: var(--ct); }
.luz2 .cuenta { display: inline-grid; place-items: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 99px; background: var(--c); color: #fff; font-size: 14px; font-weight: 800; }
.contenido2 { display: flex; flex-direction: column; min-width: 0; height: 768px; }
.contenido2 .pantalla { padding-top: 20px; }
/* Más: un panel que sale del riel */
.flyout { position: absolute; left: 96px; top: 96px; width: 640px; z-index: 50; padding: 20px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-hoja); box-shadow: var(--sombra-3); }
.flyout .grilla { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.tile { position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 4px 12px; padding: 12px; border-radius: var(--r-tarjeta); border: 1px solid var(--borde); color: inherit; text-decoration: none; cursor: pointer; }
.tile .ico-op { grid-row: span 2; }
.tile b { font-size: 16px; line-height: 22px; display: flex; gap: 8px; align-items: center; }
.tile small { font-size: 14px; line-height: 20px; color: var(--texto-2); }
.tile .pastilla { height: 22px; padding: 0 8px; margin-left: auto; }
.tile.pronto { border-style: dashed; background: transparent; }
.tile.pronto b { color: var(--texto-3); }
.tile.pronto .ico-op { opacity: .5; }
/* Lo pendiente: un cajón a la derecha, como una bandeja de salida */
.cajon { position: absolute; top: 0; right: 0; bottom: 0; width: 440px; z-index: 50; padding: 28px 24px; background: var(--superficie); box-shadow: var(--sombra-3); border-radius: var(--r-hoja) 0 0 var(--r-hoja); display: flex; flex-direction: column; gap: 12px; }
.cajon .grande { display: flex; align-items: baseline; gap: 8px; }
.linea-t { position: relative; padding-left: 20px; }
.linea-t::before { content: ""; position: absolute; left: 5px; top: 18px; bottom: 18px; width: 2px; background: var(--hundido-2); }
.linea-t .pend::before { content: ""; position: absolute; left: -20px; top: 24px; width: 12px; height: 12px; border-radius: 99px; background: var(--superficie); border: 2px solid var(--urgente); }
.linea-t .pend { position: relative; }
.cajon:not(.abierto) { display: none; }
.velo2 { position: absolute; inset: 0; background: rgba(26, 29, 27, .3); z-index: 45; display: none; }
.escena:has(.flyout.abierto) .velo2, .escena:has(.cajon.abierto) .velo2 { display: block; }
/* Alt: la pantalla se aclara y cada cosa muestra su tecla grande, en el medio */
.alt .tecla { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-width: 32px; height: 32px; font-size: 16px; border-radius: 8px; background: var(--tinta); animation: none; }
.alt .app2::after { content: ""; position: absolute; inset: 0; background: rgba(244, 242, 236, .55); z-index: 25; pointer-events: none; }
.mapa { display: none; }

/* La marca: lo marcado se pinta de pino suave con borde pino y dice qué hace Enter */

body:not(.sin-marca) .marcado { outline: 2px solid var(--pino); outline-offset: 2px; z-index: 3; }
body:not(.sin-marca) .marcado::after { content: "↵ Enter"; position: absolute; right: -10px; top: -14px; height: 22px; padding: 0 7px; border-radius: 99px; background: var(--pino); color: #fff; font: 750 14px/22px var(--letra); white-space: nowrap; z-index: 4; }
body{width:max-content}
