.app3 { display: flex; flex-direction: column; height: 768px; }

.dock { position: relative; flex: none; height: 76px; background: var(--superficie); display: flex; align-items: center; gap: 8px; padding: 4px 24px 0; box-shadow: 0 -8px 24px -16px rgba(26, 29, 27, .18); }
.dock::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }

.parte3 { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 99px; color: var(--texto-2); font-weight: 700; font-size: 16px; text-decoration: none; cursor: pointer; }
.parte3.activo { background: var(--pino); color: #fff; box-shadow: var(--sombra-2); }
.parte3 .pastilla { height: 22px; padding: 0 7px; }
.parte3.gris-item { opacity: .4; }
.dock .der { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.luz3 { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 99px; background: var(--cs); color: var(--ct); font-weight: 700; font-size: 15px; border: 0; }
.dock .vinculo { padding: 0 12px; height: 44px; }
/* Más: un panel ancho que sube de la barra */
.mega { position: absolute; left: 16px; right: 16px; bottom: 84px; z-index: 50; padding: 20px 24px 24px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-hoja); box-shadow: var(--sombra-3); }
.mega .cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 14px; }
.col { position: relative; display: grid; align-content: start; gap: 8px; padding: 16px; min-height: 196px; border-radius: var(--r-tarjeta); background: var(--fondo); color: inherit; text-decoration: none; cursor: pointer; }
.col b { font-size: 16px; line-height: 22px; }
.col small { font-size: 14px; line-height: 20px; color: var(--texto-2); }
.col .pie-col { margin-top: auto; }
.col.pronto { background: transparent; border: 1px dashed var(--borde-fuerte); }
.col.pronto b, .col.pronto small { color: var(--texto-3); }
.col.pronto .ico-op { opacity: .5; }
/* Lo pendiente: la cola de envío, como un ticket que sale de la luz */
.ticket { position: absolute; right: 24px; bottom: 84px; width: 440px; z-index: 50; padding: 20px 20px 16px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-hoja); box-shadow: var(--sombra-3); }
.ticket .sep { border-top: 2px dashed var(--borde); margin: 10px -20px; }
.velo3 { position: absolute; inset: 0 0 76px 0; background: rgba(26, 29, 27, .3); z-index: 45; display: none; }
.escena:has(.mega.abierto) .velo3, .escena:has(.ticket.abierto) .velo3 { display: block; }
/* Alt: las teclas en las esquinas; en la barra, la tecla toma el lugar del ícono */
.alt .tecla { position: absolute; top: -8px; right: -8px; }
.alt .parte3 > .tecla { position: absolute; top: 12px; left: 16px; right: auto; }
.alt .parte3 > .i { visibility: hidden; }
.alt .pestanas a > .tecla { top: -6px; right: -20px; }
.alt .col > .tecla { top: 12px; right: 12px; }
/* La marca: un visor de cuatro esquinas, como el de escanear; el cursor sigue siendo el brillo pino */
[data-m] { position: relative; }
body:not(.sin-marca) .marcado::after { content: ""; position: absolute; inset: -7px; pointer-events: none; z-index: 5; border-radius: 4px;
