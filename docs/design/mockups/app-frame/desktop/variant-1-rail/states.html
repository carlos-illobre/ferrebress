.usuario .btn { margin-left: auto; }
.cabecera .fecha { font-size: 15px; color: var(--texto-2); font-weight: 600; }
.pestanas a { cursor: pointer; }
.pestanas a.pronto { gap: 8px; }
/* Las teclas, en la esquina de cada cosa */
.alt .tecla { position: absolute; top: -8px; right: -8px; }
.alt .nav-item > .tecla, .alt .nav-sub a > .tecla { top: 50%; right: 8px; margin-top: -12px; }
.alt .nav-item > .insignia, .alt .nav-item > .pastilla, .alt .nav-sub a > .pastilla { visibility: hidden; }
.alt .pestanas a > .tecla { top: -10px; right: -18px; }
.alt .luz-v1 > .tecla { top: 50%; right: 8px; margin-top: -12px; }
.alt .luz-v1 .ch { visibility: hidden; }
.ayuda-alt { display: none; }
.alt .ayuda-alt { display: flex; position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; }
/* La marca: un anillo de tinta afuera; el cursor es el brillo pino adentro de la caja */
body:not(.sin-marca) .marcado { outline: 3px solid var(--tinta); outline-offset: 3px; z-index: 2; }
/* Lo pendiente: una tarjeta que sale de la luz */
.pop-pend { position: absolute; left: 244px; bottom: 70px; width: 420px; z-index: 50; padding: 20px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-hoja); box-shadow: var(--sombra-3); }
.pop-pend::before { content: ""; position: absolute; left: -7px; bottom: 40px; width: 14px; height: 14px; background: var(--superficie); border-left: 1px solid var(--borde); border-bottom: 1px solid var(--borde); transform: rotate(45deg); }
.pop-pend .cab { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.pop-pend .nota { margin-top: 8px; padding-top: 12px; border-top: 1px solid var(--borde); font-size: 14px; line-height: 20px; color: var(--texto-2); display: flex; gap: 8px; }
.sin-con { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20; }
body{width:max-content}
