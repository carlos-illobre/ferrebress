<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El marco · Final</title>
<!-- El marco · maqueta final. Parte de la variante 1 (Evolución) del director, con el área de
     trabajo en blanco y el menú que se minimiza a íconos (01-D13). Una sola página: desde 900 px
     es la computadora (menú a la izquierda), debajo es el celular (menú abajo). -->
<link rel="stylesheet" href="../../../common/common.css">
<link rel="stylesheet" href="shared.css">
<script src="../../../common/icons.js"></script>
<script src="extra-icons.js"></script>
<script src="../../../common/navigate.js" defer></script>
<style>
  .p-only { display: none !important; }

  /* =================== Computadora =================== */
  /* El ancho del menú vive en una variable (00 · R1.6): agrandado, lo justo para «Catálogo» con
     «Pronto» (216 px); minimizado, el ícono de 48 px con 8 px a cada lado (64 px). */
  body { --lado-ancho: 216px; --lado-mini: 64px; }
  body.plegado { --lado-ancho: var(--lado-mini); }
  .vista { display: grid; grid-template-columns: var(--lado-ancho) 1fr; height: 100vh; }

  /* ---------- El lateral ---------- */
  .lado { position: relative; z-index: 3; display: flex; flex-direction: column; gap: 2px; min-height: 0; padding: 20px 8px 16px; }
  /* El fondo y el borde son piezas aparte para poder animarlos con transform. */
  .lado-fondo { position: absolute; inset: 0; z-index: -1; background: var(--superficie); transform-origin: 0 50%; }
  .lado-linea { position: absolute; top: 0; bottom: 0; right: 0; width: 1px; background: var(--borde); }

  /* La marca: agrandado, el logotipo (la F es la primera letra de «Ferrebress», como en la
     entrada); minimizado, solo la F. El isotipo va encima de la F del logotipo, del mismo tamaño,
     así al minimizar se apaga la palabra y la F queda quieta.
     Agrandada, la cabecera es solo el renglón del logotipo, con poco aire hasta Vender; minimizada,
     suma debajo de la F el botón de minimizar. El menú baja 29 px al minimizar y sube al agrandar,
     animado con transform (ver «La animación de minimizar»), así no salta. */
  .lado-marca { position: relative; height: 36px; margin: 4px 0 21px 8px; }
  body.plegado .lado-marca { height: 76px; margin-bottom: 10px; }
  .lado-logo { display: block; height: 36px; width: auto; }
  .lado-isotipo { position: absolute; left: -3.6px; top: -1.35px; width: 38.4px; height: 38.4px; }

  .menu, .sub { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .parte { position: relative; width: 100%; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 10px 0 14px; border: 0; border-radius: var(--r); background: transparent; color: var(--texto-2); font-weight: 650; font-size: 15px; text-align: left; white-space: nowrap; cursor: default; transition: background var(--t-micro); }
  .parte .i { color: var(--texto-3); }
  .parte .nombre { flex: 1; }
  /* Con Alt, la tecla aparece dentro de cada renglón, a la derecha del texto, como en «Salir».
     Donde está «Pronto», la tecla ocupa su lugar mientras Alt está apretado (no entran las dos). */
  body.alt:not(.con-capa) .menu > li > .parte .pronto,
  body.alt .sub.capa-arriba .parte .pronto { display: none; }
  .lado .marca-tecla { outline-offset: -3px; }
  /* Donde no hay texto (el botón de minimizar y todo lo minimizado), la tecla va en la esquina de
     arriba a la derecha del ícono, dentro del botón; minimizado, en el lugar de la marca de «Pronto». */
  .plegar .kbd,
  body.plegado .menu > li > .parte .kbd, body.plegado .luz .kbd, .persona-mini .kbd { position: absolute; z-index: 5; right: -6px; top: -4px; box-shadow: 0 0 0 2px var(--superficie); }
  body.alt.plegado:not(.con-capa) .menu > li > .parte .pronto-mini { display: none; }

  /* El botón para minimizar: un ícono solo en la cabecera, a la derecha del logotipo; minimizado,
     debajo de la F (panel-left-close al minimizar, panel-left-open al agrandar). */
  .plegar { position: absolute; top: 0; right: 0; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: var(--r); background: transparent; color: var(--texto-3); cursor: pointer; transition: background var(--t-micro); }
  .plegar:hover { background: var(--fondo); color: var(--texto-2); }
  .plegar .plegar-abre, body.plegado .plegar .plegar-cierra { display: none; }
  body.plegado .plegar .plegar-abre { display: block; }
  body.plegado .plegar { top: 40px; right: auto; left: -8px; width: 48px; }
  .parte.abre { cursor: pointer; color: var(--tinta); }
  .parte.abre .i { color: var(--texto-2); }
  .parte:hover { background: var(--fondo); }
  /* La opción abierta (al entrar, la primera del menú): fondo verde claro y texto verde oscuro.
     Minimizado, el mismo fondo detrás del ícono. El fondo es una pieza aparte (::after) para
     achicarlo con transform junto con el lateral al minimizar. */
  .parte[aria-current="page"], .parte[aria-current="page"]:hover { isolation: isolate; background: transparent; color: var(--pino); font-weight: 750; }
  .parte[aria-current="page"]::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--pino-suave); transform-origin: 0 50%; }
  .parte[aria-current="page"] .i { color: var(--pino); }
  .parte.mas[aria-expanded="true"] { background: var(--pino-suave); color: var(--pino); font-weight: 750; }
  .parte.mas[aria-expanded="true"] .i { color: var(--pino); }
  .parte.mas[aria-expanded="true"]::before { content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 4px; border-radius: 0 4px 4px 0; background: var(--accion); }
  /* Más se abre siempre como panel al costado: sus opciones con «Pronto» no entran en el menú angosto. */
  .sub { margin: 0; width: 264px; padding: 8px; }
  .sub .parte { height: 40px; font-size: 14px; gap: 10px; }
  .sub .parte .i { width: 18px; height: 18px; }
  /* «Pronto» minimizado: una marca chica con el reloj, arriba a la derecha del ícono */
  .pronto-mini { display: none; position: absolute; left: 27px; top: 4px; width: 16px; height: 16px; border-radius: 99px; background: var(--superficie); box-shadow: 0 0 0 1px var(--borde-fuerte); color: var(--texto-2); place-items: center; }
  .pronto-mini .i { width: 11px; height: 11px; color: var(--texto-2); }

  @media (prefers-reduced-motion: no-preference) {
    .sub:not([hidden]) li { animation: entra-sub 240ms var(--curva) backwards; }
    .sub li:nth-child(2) { animation-delay: 25ms; } .sub li:nth-child(3) { animation-delay: 50ms; }
    .sub li:nth-child(4) { animation-delay: 75ms; } .sub li:nth-child(5) { animation-delay: 100ms; } .sub li:nth-child(6) { animation-delay: 125ms; }
    .menu > li { animation: entra-sub 320ms var(--curva) backwards; }
    .menu > li:nth-child(2) { animation-delay: 30ms; } .menu > li:nth-child(3) { animation-delay: 60ms; } .menu > li:nth-child(4) { animation-delay: 90ms; } .menu > li:nth-child(5) { animation-delay: 120ms; }
  }
  @keyframes entra-sub { from { opacity: 0; transform: translateY(-6px); } }

  /* ---------- El pie: la luz y la persona ---------- */
  .lado-pie { margin-top: auto; display: grid; gap: 8px; padding-top: 12px; }
  /* El texto largo de la luz puede ir en dos renglones en el menú angosto. */
  .luz { position: relative; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 12px; line-height: 18px; border-radius: var(--r); border: 0; background: var(--logro-suave); color: var(--logro-texto); font-size: 14px; font-weight: 700; text-align: left; transition: transform var(--t-micro) var(--curva); }
  .luz:active { transform: scale(.98); }
  .luz .luz-texto { flex: 1; }
  body[data-net="offline"] .luz { background: var(--urgente-suave); color: var(--urgente-texto); }
  body[data-net="sending"] .luz { background: var(--pino-suave); color: var(--pino-texto); }
  .persona { border: 1px solid var(--borde); border-radius: var(--r-tarjeta); padding: 12px; display: grid; gap: 10px; background: var(--superficie); box-shadow: var(--sombra-1); }
  .persona-quien { display: flex; align-items: center; gap: 10px; }
  .persona-quien b { display: block; font-size: 15px; font-weight: 750; line-height: 20px; }
  .persona-quien small { display: block; font-size: 14px; color: var(--texto-2); line-height: 18px; }
  .persona .btn { width: 100%; }
  /* Minimizado, la persona es solo sus iniciales */
  .persona-mini { display: none; position: relative; width: 48px; height: 48px; padding: 0; border: 0; border-radius: var(--r); background: transparent; place-items: center; cursor: pointer; }
  .persona-mini:hover { background: var(--fondo); }
  .persona-mini[aria-expanded="true"] { background: var(--pino-suave); }

  /* ---------- Minimizado: 64 px, solo íconos (00 · R1.6) ---------- */
  body.plegado .menu > li > .parte .flecha,
  body.plegado .luz .luz-texto, body.plegado .luz > svg:last-child { display: none; }
  body.plegado .menu > li > .parte { width: 48px; padding: 0 14px; }
  body.plegado .lado-logo,
  body.plegado .menu > li > .parte .nombre,
  body.plegado .menu > li > .parte .pronto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  body.plegado .menu > li > .parte .pronto-mini { display: grid; }
  body.plegado .luz { width: 48px; padding: 0; justify-content: center; }
  body.plegado .persona-mini { display: grid; }
  body.plegado .persona { display: none; }
  /* Más (siempre) y la persona minimizada se abren como paneles al costado */
  .panel-costado { position: fixed; z-index: 30; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-3); }
  body.plegado .persona.abierta { display: grid; bottom: 16px; left: calc(var(--lado-mini) + 8px); width: 264px; }
  @media (prefers-reduced-motion: no-preference) {
    .panel-costado:not([hidden]) { animation: entra-costado var(--t) var(--curva) both; }
  }
  @keyframes entra-costado { from { opacity: 0; transform: translateX(-8px); } }

  /* ---------- La animación de minimizar y agrandar: solo transform y opacity ----------
     El ancho de la columna cambia de golpe cuando no se ve (el área está detrás);
     lo que se ve es el fondo que se achica, el borde que se corre, y los nombres y el botón de
     minimizar que se apagan (el botón se enciende en su lugar nuevo). */
  .vista.anima .lado { pointer-events: none; }
  @media (prefers-reduced-motion: no-preference) {
    body.cierra .lado-fondo { animation: fondo-cierra 240ms var(--curva) forwards; }
    body.cierra .lado-linea { animation: corre-cierra 240ms var(--curva) forwards; }
    body.cierra .menu { animation: menu-baja 240ms var(--curva) forwards; }
    body.cierra .menu > li > .parte[aria-current="page"]::after { animation: elegida-cierra 240ms var(--curva) forwards; }
    body.cierra .lado-logo, body.cierra .menu > li > .parte .nombre, body.cierra .menu > li > .parte .pronto,
    body.cierra .menu > li > .parte .flecha, body.cierra .plegar, body.cierra .lado-pie { animation: se-apaga 120ms var(--curva-salida) forwards; }

    body.abre .lado-fondo { animation: fondo-abre 240ms var(--curva) both; }
    body.abre .lado-linea { animation: corre-abre 240ms var(--curva) both; }
    body.abre .menu { animation: menu-sube 240ms var(--curva) both; }
    body.abre .menu > li > .parte[aria-current="page"]::after { animation: elegida-abre 240ms var(--curva) both; }
    body.abre .lado-logo, body.abre .menu > li > .parte .nombre, body.abre .menu > li > .parte .pronto,
    body.abre .menu > li > .parte .flecha, body.abre .plegar, body.abre .lado-pie { animation: se-enciende 160ms var(--curva) 100ms both; }

    body.plegado .pronto-mini, body.plegado .plegar, body.plegado .lado-pie { animation: se-enciende 160ms var(--curva) both; }
  }
  /* 64 / 216 = .2963; 216 − 64 = 152 px */
  @keyframes fondo-cierra { to { transform: scaleX(.2963); } }
  @keyframes fondo-abre { from { transform: scaleX(.2963); } }
  @keyframes corre-cierra { to { transform: translateX(-152px); } }
  @keyframes corre-abre { from { transform: translateX(-152px); } }
  /* La cabecera minimizada mide 29 px más: (76 + 10) − (36 + 21) */
  @keyframes menu-baja { to { transform: translateY(29px); } }
  @keyframes menu-sube { from { transform: translateY(29px); } }
  /* La opción elegida pasa de 200 px a 48 px: 48 / 200 = .24 */
  @keyframes elegida-cierra { to { transform: scaleX(.24); } }
  @keyframes elegida-abre { from { transform: scaleX(.24); } }
  @keyframes se-apaga { to { opacity: 0; } }
  @keyframes se-enciende { from { opacity: 0; } }

  /* ---------- El área de trabajo: la pantalla de la primera opción, hoy en blanco ---------- */
  .area { min-width: 0; }

  /* ---------- Los globos al costado del lateral ---------- */
  /* globo: «todavía no está»; rotulo: el nombre de un ícono solo. Mismo dibujo. */
  .globo, .rotulo { position: fixed; z-index: 20; display: flex; align-items: flex-start; gap: 10px; max-width: 320px; padding: 12px 14px; border-radius: var(--r); background: var(--pino); color: #fff; font-size: 14px; line-height: 20px; font-weight: 600; box-shadow: var(--sombra-3); pointer-events: none; }
  .rotulo { display: block; padding: 8px 12px; white-space: nowrap; max-width: none; }
  .globo::before, .rotulo::before { content: ""; position: absolute; left: -6px; top: 50%; margin-top: -6px; width: 12px; height: 12px; background: var(--pino); transform: rotate(45deg); border-radius: 2px; }
  .globo::before { top: 16px; margin-top: 0; }
  .globo b, .rotulo b { font-weight: 800; }
  @media (prefers-reduced-motion: no-preference) {
    .globo:not([hidden]) { animation: entra-globo 240ms var(--curva) both; }
    .rotulo:not([hidden]) { animation: entra-globo 160ms var(--curva) both; }
  }
  @keyframes entra-globo { from { opacity: 0; transform: translateX(-8px); } }

  /* ---------- Lo pendiente: un panel que sale de la luz ---------- */
  .pop { position: fixed; z-index: 30; bottom: 24px; width: 440px; padding: 16px; border-radius: var(--r-tarjeta); background: var(--superficie); border: 1px solid var(--borde); box-shadow: var(--sombra-3); transform-origin: 0 100%; }
  .pop-cerrar { position: absolute; top: 12px; right: 12px; gap: 6px; }
  /* Con Alt, la tecla va a la derecha de la ×: el botón crece hacia la izquierda. */
  body.alt .pop-cerrar { width: auto; padding: 0 6px 0 8px; }
  @media (prefers-reduced-motion: no-preference) { .pop:not([hidden]) { animation: pop-in 220ms var(--curva) both; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(.94) translateX(-8px); } }

  /* =================== Celular (debajo de 900 px) =================== */
  @media (max-width: 899px) {
    .d-only { display: none !important; }
    .p-only { display: revert !important; }
    body { --tostada-abajo: 108px; --nav-alto: 92px; }
    .vista { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .p-cab { display: flex !important; align-items: center; gap: 12px; padding: 40px 16px 0; }
    .p-logo { height: 28px; width: auto; margin-right: auto; }
    .p-avatar { border: 0; padding: 0; background: none; }
    .p-luz { display: flex !important; align-items: center; gap: 8px; margin: 8px 16px 0; height: 36px; padding: 0 12px; align-self: flex-start; border: 0; border-radius: 999px; background: var(--logro-suave); color: var(--logro-texto); font-size: 14px; font-weight: 700; }
    body[data-net="offline"] .p-luz { background: var(--urgente-suave); color: var(--urgente-texto); }
    body[data-net="sending"] .p-luz { background: var(--pino-suave); color: var(--pino-texto); }
    .area { flex: 1; }
    .p-nav { display: grid !important; flex: none; grid-template-columns: repeat(5, 1fr); height: 92px; padding: 4px 4px 14px; background: var(--superficie); border-top: 1px solid var(--borde); }
    .p-nav-parte { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; border: 0; background: none; color: var(--texto-2); font-size: 14px; font-weight: 650; padding: 0; cursor: default; }
    .p-nav-parte .i { width: 26px; height: 26px; }
    .p-nav-parte .pronto { height: auto; padding: 0; background: none; color: var(--texto-3); font-size: 14px; line-height: 16px; font-weight: 700; }
    .p-nav-parte .pronto.vacio { visibility: hidden; }
    .p-nav-parte .lbl { line-height: 18px; }
    .p-nav-parte.abre { cursor: pointer; }
    /* La elegida: ícono y nombre en naranja, sin fondo ni raya (la imagen de Carlos) */
    .p-nav-parte[aria-current="page"] { color: var(--accion); font-weight: 800; }
    .p-nav-parte .ico-mov { display: inline-block; }
  }

  /* Hojas del celular: suben desde abajo */
  .fondo-hoja { position: fixed; top: 0; left: 0; right: 0; z-index: 40; background: rgb(26 29 27 / .3); }
  .fondo-hoja, .hoja { bottom: var(--nav-alto, 0); }
  .hoja { position: fixed; left: 0; right: 0; z-index: 41; max-height: calc(100% - 120px); overflow: auto; padding: 8px 16px 20px; border-radius: var(--r-hoja) var(--r-hoja) 0 0; background: var(--fondo); box-shadow: var(--sombra-3); }
  .hoja-asa { width: 40px; height: 5px; border-radius: 99px; background: var(--borde-fuerte); margin: 4px auto 12px; }
  @media (prefers-reduced-motion: no-preference) {
    .fondo-hoja:not([hidden]) { animation: fundido var(--t-nav) var(--curva) both; }
    .hoja:not([hidden]) { animation: sube var(--t-nav) var(--curva) both; }
  }
  @keyframes fundido { from { opacity: 0; } }
  @keyframes sube { from { transform: translateY(100%); } }
  /* ---------- Celular: Más es una pantalla entera, no una hoja ----------
     Reemplaza la cabecera y el área de trabajo; el menú de abajo sigue a la vista, con Más en
     naranja. Título grande, la luz, la persona, las opciones en dos grupos y Salir aparte. */
  .p-mas[hidden] { display: none !important; }
  .vista.con-mas .p-cab, .vista.con-mas .p-luz, .vista.con-mas .area { display: none !important; }
  @media (max-width: 899px) {
    .p-mas:not([hidden]) { display: flex !important; flex-direction: column; flex: 1; min-height: 0; overflow: auto; padding: 40px 16px 24px; }
  }
  .p-mas > * { flex: none; }
  .p-mas-cab { display: grid; gap: 4px; }
  .p-mas-titulo { margin: 0; font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -.02em; color: var(--tinta); }
  /* La luz, como una línea bajo el título; al tocarla, lo pendiente (00 · R4.2). */
  .p-mas-luz { justify-self: start; display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0; border: 0; background: none; color: var(--texto-2); font-size: 14px; font-weight: 650; }
  .p-mas-luz .luz-punto { width: 8px; height: 8px; }
  body[data-net="offline"] .p-mas-luz { color: var(--urgente-texto); }
  body[data-net="sending"] .p-mas-luz { color: var(--pino-texto); }
  .p-mas-tarjeta { margin-top: 12px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1); }
  .p-mas-persona { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .p-mas-persona .avatar { width: 48px; height: 48px; font-size: 16px; }
  .p-mas-persona b { display: block; font-size: 16px; line-height: 22px; font-weight: 700; }
  .p-mas-persona small { display: block; font-size: 14px; line-height: 20px; color: var(--texto-2); }
  .p-mas-grupo-titulo { margin: 20px 4px 0; font-size: 14px; line-height: 20px; font-weight: 650; color: var(--texto-2); }
  .p-mas-grupo { list-style: none; margin: 8px 0 0; padding: 0; overflow: hidden; }
  .p-mas-grupo li + li { border-top: 1px solid var(--borde); }
  .p-mas-opcion { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 12px 12px 16px; border: 0; background: none; color: var(--tinta); text-align: left; cursor: pointer; transition: background var(--t-micro); }
  .p-mas-opcion:active { background: var(--fondo); }
  .p-mas-opcion .flecha { color: var(--texto-3); }
  /* El ícono en un cuadrado de color suave: ámbar lo que avisa, pino lo del negocio, neutro lo propio. */
  .p-mas-ic { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: var(--r-chico); background: var(--pino-suave); color: var(--pino-texto); }
  .p-mas-ic.urgente { background: var(--urgente-suave); color: var(--urgente-texto); }
  .p-mas-ic.neutro { background: var(--hundido); color: var(--texto-2); }
  .p-mas-ic.error { background: var(--error-suave); color: var(--error-texto); }
  .p-mas-texto { flex: 1; min-width: 0; }
  .p-mas-texto b { display: block; font-size: 16px; line-height: 22px; font-weight: 700; }
  .p-mas-texto small { display: block; font-size: 14px; line-height: 20px; color: var(--texto-2); }
  .p-mas-salir { margin-top: 20px; background: var(--superficie); }
  .p-mas-salir:active { background: var(--fondo); }
  .p-mas-salir .p-mas-texto b { color: var(--error-texto); }
  @media (prefers-reduced-motion: no-preference) {
    .p-mas:not([hidden]) > * { animation: entra-mas var(--t) var(--curva) backwards; }
    .p-mas > :nth-child(2) { animation-delay: 30ms; } .p-mas > :nth-child(3), .p-mas > :nth-child(4) { animation-delay: 60ms; }
    .p-mas > :nth-child(5), .p-mas > :nth-child(6) { animation-delay: 90ms; } .p-mas > :nth-child(7) { animation-delay: 120ms; }
  }
  @keyframes entra-mas { from { opacity: 0; transform: translateY(8px); } }
</style>

<script src="shared.js"></script>
<script>
(function () {
  var M = window.Marco;
  var $ = function (id) { return document.getElementById(id); };
  var body = document.body, lado = $("lado"), vista = $("vista");
  var mas = $("mas"), sub = $("sub"), globo = $("globo"), rotulo = $("rotulo"), pop = $("pop");
  var plegarBtn = $("plegar"), persona = $("persona"), personaMini = $("persona-mini");
  var DURA = 240;

  function plegado() { return body.classList.contains("plegado"); }
  // Lo que se abre al costado del lateral arranca a 8 px de lo tocado o del borde del lateral.
  function alCostado(el) { return Math.max(el.getBoundingClientRect().right, lado.getBoundingClientRect().right) + 8; }

  // ---------- El rótulo: el nombre del ícono, al pasar el mouse o con la marca ----------
  function textoRotulo(el) {
    if (el === plegarBtn) return el.getAttribute("aria-label");
    if (el.id === "luz") return el.querySelector("[data-luz] .largo").textContent;
    if (el === personaMini) return "<b>Rubén Paredes</b> · Administrador";
    var n = el.querySelector(".nombre");
    return "<b>" + n.textContent + "</b>" + (el.querySelector(".pronto") ? " · Pronto" : "");
  }
  function mostrarRotulo(el) {
    var r = el.getBoundingClientRect();
    rotulo.innerHTML = textoRotulo(el);
    rotulo.hidden = false;
    rotulo.style.left = alCostado(el) + "px";
    rotulo.style.top = (r.top + r.height / 2 - rotulo.offsetHeight / 2) + "px";
  }
  function ocultarRotulo() { rotulo.hidden = true; }
  function llevaRotulo(el) {
    if (!el || !lado.contains(el)) return false;
    if (el === plegarBtn) return true; // es un ícono solo: dice su nombre agrandado y minimizado
    return plegado() && !sub.contains(el) && !persona.contains(el);
  }
  lado.querySelectorAll("[data-nav]").forEach(function (el) {
    el.addEventListener("pointerenter", function (e) { if (e.pointerType !== "touch" && llevaRotulo(el)) mostrarRotulo(el); });
    el.addEventListener("pointerleave", ocultarRotulo);
  });
  M.alMarcar(function (el) { if (llevaRotulo(el)) mostrarRotulo(el); else ocultarRotulo(); });

  // ---------- Más: un panel al costado del lateral, agrandado o minimizado ----------
  function cerrarMasCapa() { abrirMas(false); }
  function abrirMas(abrir) {
    if (abrir === undefined) abrir = sub.hidden;
    if (abrir === !sub.hidden) return;
    sub.hidden = !abrir;
    mas.setAttribute("aria-expanded", String(abrir));
    if (abrir) {
      ocultarRotulo();
      sub.classList.add("panel-costado", "capa-arriba");
      sub.style.left = alCostado(mas) + "px";
      sub.style.top = mas.getBoundingClientRect().top + "px";
      M.abrirCapa(cerrarMasCapa);
    } else if (!abrir) {
      sub.classList.remove("panel-costado", "capa-arriba");
      sub.style.top = ""; sub.style.left = "";
      M.cerrarCapa(cerrarMasCapa);
      if (sub.contains(M.marcado)) M.marcar(mas);
    }
  }
  mas.addEventListener("click", function () { abrirMas(); });

  // ---------- La persona minimizada: las iniciales abren su tarjeta, con Salir ----------
  function cerrarPersona() {
    if (!persona.classList.contains("abierta")) return;
    persona.classList.remove("abierta", "panel-costado", "capa-arriba");
    personaMini.setAttribute("aria-expanded", "false");
    M.cerrarCapa(cerrarPersona);
    if (persona.contains(M.marcado)) M.marcar(personaMini);
  }
  personaMini.addEventListener("click", function () {
    if (persona.classList.contains("abierta")) { cerrarPersona(); return; }
    ocultarRotulo();
    persona.classList.add("abierta", "panel-costado", "capa-arriba");
    personaMini.setAttribute("aria-expanded", "true");
    M.abrirCapa(cerrarPersona);
  });

  // ---------- Lo que dice «Pronto»: se sacude y el globo lo explica ----------
  var gTimer;
  function pronto(el) {
    var r = el.getBoundingClientRect();
    ocultarRotulo();
    $("globo-txt").innerHTML = "<b>" + el.dataset.nombre + "</b> todavía no está. Cuando se sume, se abre desde acá y deja de decir «Pronto».";
    globo.style.left = alCostado(el) + "px";
    globo.style.top = (r.top + r.height / 2 - 22) + "px";
    globo.hidden = false;
    el.classList.remove("no-esta"); void el.offsetWidth; el.classList.add("no-esta");
    clearTimeout(gTimer);
    gTimer = setTimeout(function () { globo.hidden = true; }, 2600);
  }
  lado.querySelectorAll(".parte[data-nombre]").forEach(function (b) {
    b.addEventListener("click", function () { pronto(b); });
  });

  // ---------- La luz: lo pendiente ----------
  function cerrarPop() { if (pop.hidden) return; pop.hidden = true; pop.classList.remove("capa-arriba"); M.cerrarCapa(cerrarPop); }
  $("luz").addEventListener("click", function () {
    if (!pop.hidden) { cerrarPop(); return; }
    globo.hidden = true; ocultarRotulo();
    pop.style.left = alCostado($("luz")) + "px";
    pop.hidden = false; pop.classList.add("capa-arriba"); M.abrirCapa(cerrarPop);
  });
  $("pop-cerrar").addEventListener("click", cerrarPop);

  // Tocar afuera cierra lo que se abrió al costado.
  document.addEventListener("click", function (e) {
    if (e.target.closest(".demo")) return;
    if (!pop.hidden && !pop.contains(e.target) && !$("luz").contains(e.target)) cerrarPop();
    if (!sub.hidden && !sub.contains(e.target) && !mas.contains(e.target)) abrirMas(false);
    if (persona.classList.contains("abierta") && !persona.contains(e.target) && !personaMini.contains(e.target)) cerrarPersona();
  });

  $("salir").addEventListener("click", M.salir);
  $("p-salir").addEventListener("click", M.salir);

  // ---------- Minimizar y agrandar el menú (00 · R1.6). Siempre arranca agrandado: no se guarda. ----------
  var animando = false;
  function plegar(si) {
    if (animando) return;
    if (si === undefined) si = !plegado();
    abrirMas(false); cerrarPersona(); cerrarPop(); globo.hidden = true; ocultarRotulo();
    plegarBtn.setAttribute("aria-expanded", String(!si));
    plegarBtn.setAttribute("aria-label", si ? "Agrandar el menú" : "Minimizar el menú");
    function listo() {
      animando = false; vista.classList.remove("anima");
      if (M.marcado && llevaRotulo(M.marcado)) mostrarRotulo(M.marcado);
      if (plegarBtn.matches(":hover") && llevaRotulo(plegarBtn)) mostrarRotulo(plegarBtn);
    }
    if (M.reducido) { body.classList.toggle("plegado", si); listo(); return; }
    animando = true; vista.classList.add("anima");
    if (si) {
      body.classList.add("cierra");
      setTimeout(function () { body.classList.remove("cierra"); body.classList.add("plegado"); listo(); }, DURA);
    } else {
      body.classList.remove("plegado"); body.classList.add("abre");
      setTimeout(function () { body.classList.remove("abre"); listo(); }, DURA + 100);
    }
  }
  plegarBtn.addEventListener("click", function () { plegar(); });

  // ---------- Teclado: ↑ ↓ recorren el menú, → abre Más, ← vuelve, Enter activa ----------
  function recorrido() { return Array.prototype.filter.call(lado.querySelectorAll("[data-nav]"), function (el) { return el.offsetParent !== null; }); }
  document.addEventListener("keydown", function (e) {
    if (M.angosto() || e.altKey || e.ctrlKey || e.metaKey) return;
    var lista = recorrido(), i = lista.indexOf(M.marcado);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (i < 0) { M.marcar(lista[e.key === "ArrowDown" ? 0 : lista.length - 1]); return; }
      M.marcar(lista[(i + (e.key === "ArrowDown" ? 1 : -1) + lista.length) % lista.length]);
    } else if (e.key === "ArrowRight" && M.marcado === mas && sub.hidden) {
      e.preventDefault(); abrirMas(true);
      M.marcar(sub.querySelector("[data-nav]"));
    } else if (e.key === "ArrowLeft" && M.marcado) {
      e.preventDefault();
      if (sub.contains(M.marcado)) abrirMas(false);
      else if (M.marcado === mas && !sub.hidden) abrirMas(false);
      else if (persona.contains(M.marcado)) cerrarPersona();
    } else if (e.key === "Enter" && M.marcado) {
      e.preventDefault(); M.marcado.click();
    }
  });

  // ---------- Celular ----------
  // Más es una pantalla: reemplaza la cabecera y el área de trabajo, y la elegida del menú de abajo
  // pasa a ser Más. Se vuelve tocando la parte abierta (Vender).
  // La elegida (aria-current, que es lo que la pinta de naranja) pasa a Más y vuelve a la parte abierta.
  var pMas = $("p-mas"), pantallaMas = $("p-mas-pantalla"), parteAbierta = document.querySelector(".p-nav [aria-current]");
  function verMas(si) {
    if (si === !pantallaMas.hidden) return;
    cerrarHoja();
    pantallaMas.hidden = !si;
    vista.classList.toggle("con-mas", si);
    (si ? parteAbierta : pMas).removeAttribute("aria-current");
    (si ? pMas : parteAbierta).setAttribute("aria-current", "page");
    if (si) pantallaMas.scrollTop = 0;
  }
  pMas.addEventListener("click", function () { verMas(true); });
  $("p-avatar").addEventListener("click", function () { verMas(true); });

  // La hoja de lo pendiente, que sale de la luz.
  var fondo = $("fondo-hoja"), hojaLuz = $("hoja-luz"), abierta = null;
  function abrirHoja() {
    abierta = hojaLuz; hojaLuz.hidden = false; fondo.hidden = false; hojaLuz.classList.add("capa-arriba");
    M.abrirCapa(cerrarHoja);
  }
  function cerrarHoja() {
    if (!abierta) return;
    hojaLuz.hidden = true; hojaLuz.classList.remove("capa-arriba"); fondo.hidden = true;
    abierta = null; M.cerrarCapa(cerrarHoja);
  }
  fondo.addEventListener("click", cerrarHoja);
  $("p-luz").addEventListener("click", abrirHoja);
  $("p-mas-luz").addEventListener("click", abrirHoja);
  document.querySelectorAll(".p-nav [data-p]").forEach(function (b) {
    b.addEventListener("click", function () {
      // Con Más a la vista, la parte abierta vuelve a su pantalla; lo demás todavía no está.
      if (!pantallaMas.hidden && b === parteAbierta) { verMas(false); return; }
      M.noEsta(b.querySelector(".ico-mov"), b.dataset.p, "· pronto. Todavía no está.");
    });
  });
  pantallaMas.querySelectorAll("[data-p]").forEach(function (b) {
    b.addEventListener("click", function () { M.noEsta(b, b.dataset.p, "· pronto. Todavía no está."); });
  });
  // Deslizar la hoja hacia abajo la cierra.
  (function () {
    var y0 = null;
