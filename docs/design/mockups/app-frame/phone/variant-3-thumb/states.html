.celu-pantalla { padding-bottom: 100px; }
.puntos { display: flex; gap: 6px; padding: 6px 16px 0; align-items: center; font-size: 14px; color: var(--texto-3); font-weight: 600; }
.puntos i { width: 18px; height: 6px; border-radius: 99px; background: var(--pino); display: inline-block; }
.puntos i.no { width: 6px; background: var(--hundido-2); }

.base::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
.base.sin::before { background: repeating-linear-gradient(90deg, var(--urgente) 0 60px, var(--urgente-suave) 60px 68px); }

.base .foco-luz { width: 8px; height: 8px; box-shadow: 0 0 0 3px var(--cs); }
.pulgar { justify-self: center; width: 72px; height: 72px; margin-top: -40px; border-radius: 99px; background: var(--pino); color: #fff; display: grid; place-items: center; box-shadow: var(--sombra-3); border: 4px solid var(--fondo); position: relative; }
.pulgar .i { width: 30px; height: 30px; }
.pulgar .pastilla { position: absolute; top: -4px; right: -6px; height: 24px; padding: 0 7px; border: 2px solid var(--superficie); }
.pulgar-txt { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-size: 14px; font-weight: 800; color: var(--pino); }
.base .derecha { justify-self: end; display: flex; gap: 8px; }
.redondo { width: 44px; height: 44px; border-radius: 99px; display: grid; place-items: center; background: var(--logro-suave); color: var(--logro-texto); }
/* El abanico: las cinco partes en arco, sobre el pulgar */
.abanico { position: absolute; inset: 44px 0 0 0; z-index: 35; }
.abanico:not(.abierto) { display: none; }
.abanico .fondo { position: absolute; inset: 0; background: rgba(244, 242, 236, .86); backdrop-filter: blur(6px); }
.boton-a { position: absolute; width: 76px; display: grid; justify-items: center; gap: 6px; font-weight: 750; font-size: 14px; color: var(--tinta); text-decoration: none; transform: translateX(-50%); }
.boton-a span.c { position: relative; width: 64px; height: 64px; border-radius: 99px; background: var(--superficie); box-shadow: var(--sombra-2); border: 1px solid var(--borde); display: grid; place-items: center; color: var(--texto-2); }
.boton-a span.c .i { width: 28px; height: 28px; }
.boton-a.activo span.c { background: var(--accion); border-color: var(--accion); color: #fff; box-shadow: var(--sombra-accion); }
.boton-a .pastilla { position: absolute; top: -4px; right: -8px; height: 22px; padding: 0 7px; }
.abanico .pulgar { position: absolute; left: 50%; bottom: 30px; margin: 0 0 0 -36px; background: var(--tinta); }
.abanico .ayuda { position: absolute; left: 0; right: 0; top: 200px; text-align: center; color: var(--texto-2); font-weight: 600; font-size: 15px; }
/* Más a pantalla completa */
.mas3 { position: absolute; inset: 0; z-index: 36; background: var(--fondo); display: flex; flex-direction: column; }
.mas3:not(.abierto) { display: none; }
.mas3 .grilla { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
.card3 { position: relative; display: grid; gap: 8px; padding: 14px; border-radius: 20px; background: var(--superficie); border: 1px solid var(--borde); box-shadow: var(--sombra-1); color: inherit; text-decoration: none; min-height: 132px; align-content: start; }
.card3 b { font-size: 16px; line-height: 22px; }
.card3 small { font-size: 14px; line-height: 18px; color: var(--texto-2); }
.card3 .pastilla { position: absolute; top: 12px; right: 12px; height: 24px; }
.card3.pronto { background: transparent; border-style: dashed; box-shadow: none; }
.card3.pronto b, .card3.pronto small { color: var(--texto-3); }
.card3.pronto .ico-op { opacity: .5; }
.card3 .p-pronto { position: absolute; top: 12px; right: 12px; }
.hoja3 { position: absolute; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--superficie); border-radius: var(--r-hoja) var(--r-hoja) 0 0; box-shadow: var(--sombra-3); padding: 8px 16px 28px; }
.hoja3:not(.abierto) { display: none; }
.hoja3 .asa { width: 40px; height: 5px; border-radius: 99px; background: var(--hundido-2); margin: 4px auto 12px; }
.celu:has(.hoja3.abierto)::after { content: ""; position: absolute; inset: 0; background: rgba(26, 29, 27, .3); z-index: 40; }
body{width:max-content}
