<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Catálogo · Listas · proveedores y subir lista · final</title>
<link rel="stylesheet" href="../../../common/common.css">
<link rel="stylesheet" href="lists.css">
<script src="../../../common/icons.js"></script>
<script src="icons-extra.js"></script>
</head>
<body>
<div class="prueba" aria-hidden="true"><div class="prueba-borde"></div><div class="prueba-cartel">Ambiente de prueba<span> · nada de esto es real</span></div></div>

<div class="app">
  <!-- ======== Computadora: el lateral con el menú de 00 · R1.1 y la tarjeta del vínculo al pie ======== -->
  <nav class="lateral solo-compu" aria-label="Menú">
    <div class="lado-marca"><img src="../../../common/brand/logo-on-light.png" alt="Ferrebress" width="141" height="36"><button type="button" class="btn btn-fantasma lado-plegar" aria-label="Minimizar el menú" data-tecla="e"><i class="i" data-i="panel-left-close"></i><span class="kbd">E</span></button></div>
    <button type="button" class="nav-item"><i class="i" data-i="shopping-cart"></i><span class="txt">Vender</span></button>
    <button type="button" class="nav-item" aria-current="page"><i class="i" data-i="tags"></i><span class="txt">Catálogo</span></button>
    <button type="button" class="nav-item"><i class="i" data-i="package"></i><span class="txt">Depósito</span></button>
    <button type="button" class="nav-item"><i class="i" data-i="chart-column"></i><span class="txt">Negocio</span></button>
    <button type="button" class="nav-item"><i class="i" data-i="ellipsis"></i><span class="txt">Más</span></button>
    <div class="pie">
      <div class="vinculo-tarjeta">
        <button type="button" class="indicador" data-tone="logro" data-indicador aria-label="Vínculo: Directo, con Chrome en Android">
          <span class="indicador-ico"><i class="i" data-i="smartphone"></i><span class="dot"></span></span>
          <span class="indicador-txt"><b>Directo</b><small>Chrome en Android</small></span>
        </button>
        <div class="luz" data-luz></div>
        <p class="gasto-app">Aplicación: <b>0 KB/min</b></p>
      </div>
      <div class="persona"><div class="usuario"><span class="avatar">RP</span><div class="txt"><b class="persona-nombre">Rubén Paredes</b><div class="t-detalle" data-rol>Administrador</div></div></div></div>
    </div>
  </nav>

  <main class="contenido">
    <header class="cabecera">
      <nav class="migas t-detalle solo-compu" aria-label="Dónde estoy"><span>Catálogo</span><i class="i i-s" data-i="chevron-right"></i><span>Listas</span></nav>
      <h1 class="t-titulo">Listas</h1>
      <p class="sub" data-sub></p>
      <div class="acciones">
        <button type="button" class="btn" id="nuevo" data-permiso="admin" data-tecla="n"><i class="i" data-i="user-plus"></i><span class="largo">Nuevo proveedor</span><span class="corto">Nuevo</span><span class="kbd">Alt N</span></button>
        <button type="button" class="btn btn-accion solo-compu" id="subir" data-permiso="cargar" data-sube data-tecla="u"><i class="i" data-i="upload"></i>Subir lista<span class="kbd">Alt U</span></button>
      </div>
      <!-- Celular: el vínculo debajo del título; la luz a su lado, solo sin conexión (00 · R4.1; 03 · R4.1) -->
      <div class="cab-estado solo-celu">
        <button type="button" class="indicador-pastilla" data-tone="logro" data-indicador aria-label="Vínculo: Directo, con Chrome en Windows"><i class="i i-s" data-i="monitor"></i><span class="dot"></span><span class="pastilla-txt"><b>Directo</b><span class="pastilla-gasto"><b>0 KB/min</b></span></span></button>
        <span class="p-luz"><span class="punto"></span><span>Sin conexión</span></span>
      </div>
    </header>
    <nav class="pestanas solo-compu" aria-label="Catálogo"><button type="button">Productos</button><button type="button" aria-current="page">Listas</button><button type="button">Duplicados <span class="insignia">8</span></button></nav>
    <nav class="celu-pestanas solo-celu" aria-label="Catálogo"><button type="button">Productos</button><button type="button" aria-current="page">Listas</button><button type="button">Duplicados</button></nav>
    <section class="pantalla" id="lienzo" aria-label="Proveedores y subir lista"></section>
    <footer class="teclas solo-compu" aria-label="Teclado">
      <i class="i i-s" data-i="keyboard"></i>
      <span><span class="kbd siempre">↑</span><span class="kbd siempre">↓</span> Recorrer proveedores</span>
      <span><span class="kbd siempre">Enter</span> Abrir</span>
      <span><span class="kbd siempre">Alt B</span> Buscar</span>
      <span><span class="kbd siempre">Esc</span> Cerrar o quitar la marca</span>
      <span><span class="kbd siempre">Alt</span> Ver los atajos</span>
    </footer>
  </main>

  <div class="barra-accion solo-celu" id="barra-accion"></div>
  <nav class="nav-inferior solo-celu" aria-label="Menú">
    <button type="button"><i class="i" data-i="shopping-cart"></i>Vender</button>
    <button type="button" aria-current="page"><i class="i" data-i="tags"></i>Catálogo</button>
    <button type="button"><i class="i" data-i="package"></i>Depósito</button>
    <button type="button"><i class="i" data-i="chart-column"></i>Negocio</button>
    <button type="button"><i class="i" data-i="menu"></i>Más</button>
  </nav>
</div>
<script src="lists.js"></script>
</body>
</html>
