<style>
  body { height: 100vh; overflow: hidden; }
  .cinta-app { height: 100vh; display: grid; grid-template-rows: 64px minmax(0, 1fr) auto; }
  /* Arriba: sin lateral ni pestañas. La F, de dónde viene, los días y reproducir */
  .top { display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--borde); background: var(--superficie); }
  .top .iso { width: 32px; height: 32px; }
  .top .volver { display: inline-flex; align-items: center; gap: 4px; color: var(--texto-2); font-weight: 650; font-size: 15px; text-decoration: none; cursor: pointer; background: none; border: 0; padding: 0; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .dias { display: flex; gap: 4px; padding: 4px; background: var(--hundido); border-radius: var(--r); }
  .dia-b { display: grid; justify-items: center; gap: 2px; min-width: 64px; padding: 4px 8px 6px; border: 0; border-radius: 9px; background: transparent; font: inherit; cursor: pointer; color: var(--texto-2); transition: background var(--t-micro); }
  .dia-b .d { font-size: 14px; font-weight: 750; line-height: 16px; }
  .dia-b .barras { display: flex; gap: 2px; height: 10px; align-items: flex-end; }
  .dia-b .barras i { width: 3px; border-radius: 2px; background: var(--texto-3); opacity: .5; display: block; }
  .dia-b .barras i.rojo { background: var(--error); opacity: 1; } .dia-b .barras i.ambar { background: var(--urgente); opacity: 1; }
  .dia-b.elegido { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-1); }
  .play { min-width: 168px; }

  /* La cinta: una fila por persona, el tiempo de izquierda a derecha */
  .escena { position: relative; padding: 16px 24px 0; min-height: 0; display: flex; flex-direction: column; }
  .leyenda { display: flex; gap: 16px; align-items: center; font-size: 14px; color: var(--texto-2); font-weight: 600; margin-bottom: 8px; }
  .leyenda span { display: inline-flex; gap: 6px; align-items: center; }
  .leyenda i.p { width: 10px; height: 10px; border-radius: 99px; display: inline-block; background: var(--texto-3); }
  .leyenda i.p.rojo { background: var(--error); } .leyenda i.p.ambar { background: var(--urgente); } .leyenda i.p.anillo { background: transparent; box-shadow: inset 0 0 0 2px var(--texto-3); }
  .leyenda .seg { margin-left: auto; }
  .tablero { position: relative; flex: 1; min-height: 0; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-1); overflow: hidden; }
  .carriles { position: absolute; inset: 0 0 32px 0; display: grid; }
  .carril { display: grid; grid-template-columns: 196px 1fr; align-items: center; border-bottom: 1px solid var(--borde); position: relative; transition: opacity var(--t) var(--curva); cursor: pointer; }
  .carril:last-child { border-bottom: 0; }
  .carril .quien { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 100%; border-right: 1px solid var(--borde); font-size: 15px; font-weight: 700; min-width: 0; }
  .carril .quien span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .carril .quien small { display: block; font-size: 14px; font-weight: 500; color: var(--texto-2); }
  .carril.afuera { background: linear-gradient(90deg, var(--urgente-suave), rgba(255,243,216,.35)); }
  .carril.baja .quien { color: var(--texto-3); }
  .carril:hover .quien { background: var(--hundido); }
  .tablero.aislado .carril:not(.foco) { opacity: .35; }
  .eje { position: absolute; left: 196px; right: 0; bottom: 0; height: 32px; border-top: 1px solid var(--borde); }
  .eje span { position: absolute; top: 6px; transform: translateX(-50%); font-size: 14px; color: var(--texto-3); font-weight: 650; }
  .rejilla { position: absolute; left: 196px; right: 0; top: 0; bottom: 32px; pointer-events: none; }
  .rejilla i { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--borde); opacity: .7; }
  svg.flechas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  svg.flechas path { fill: none; stroke: var(--texto-3); stroke-width: 1.5; opacity: .28; stroke-dasharray: 3 4; transition: opacity var(--t); }
  svg.flechas path.rojo { stroke: var(--error); } svg.flechas path.ambar { stroke: var(--urgente); }
  svg.flechas path.sel { opacity: 1; stroke-width: 2.5; stroke-dasharray: none; stroke: var(--pino); }
  svg.flechas path.sel.rojo { stroke: var(--error); }
  .punto { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 99px; border: 2px solid var(--superficie); background: var(--texto-3); box-shadow: 0 1px 3px rgba(26,29,27,.25); cursor: pointer; padding: 0; transition: transform var(--t) var(--rebote); z-index: 2; }
  .punto.rojo { background: var(--error); } .punto.ambar { background: var(--urgente); }
  .punto.anillo { background: var(--superficie); border: 2.5px solid var(--texto-3); width: 12px; height: 12px; margin: -6px 0 0 -6px; z-index: 1; cursor: default; pointer-events: none; }
  .punto.anillo.rojo { border-color: var(--error); }
  .punto:hover { transform: scale(1.3); }
  .punto.sel { transform: scale(1.6); box-shadow: 0 0 0 4px rgba(18,56,47,.18), 0 2px 6px rgba(26,29,27,.3); }
  .punto.anillo.sel { transform: scale(1.4); border-color: var(--pino); }
  .punto.late { animation: late 600ms var(--rebote); }
  @keyframes late { 0% { transform: scale(1); } 40% { transform: scale(2.1); } 100% { transform: scale(1.6); } }
  .cabezal { position: absolute; top: 0; bottom: 32px; left: 0; width: 2px; background: var(--pino); z-index: 3; pointer-events: none; will-change: transform; }
  .cabezal .hora { position: absolute; bottom: -30px; left: 1px; transform: translateX(-50%); height: 26px; padding: 0 8px; border-radius: 8px; background: var(--pino); color: #fff; font-size: 14px; font-weight: 800; display: grid; place-items: center; white-space: nowrap; }
  .cabezal .asa { position: absolute; top: -2px; left: 1px; width: 14px; height: 14px; margin-left: -7px; border-radius: 4px; background: var(--pino); }
  .zona-arrastre { position: absolute; left: 196px; right: 0; bottom: 0; height: 32px; cursor: ew-resize; z-index: 4; }

  /* El subtítulo: lo que pasó en el momento del cabezal */
  .subtitulo { margin: 12px 24px 16px; display: grid; grid-template-columns: 96px minmax(0, 1fr) 280px; gap: 20px; align-items: start; padding: 16px 20px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra-2); min-height: 150px; position: relative; overflow: hidden; }
  .subtitulo::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--borde-fuerte); }
  .subtitulo.rojo::before { background: var(--error); } .subtitulo.ambar::before { background: var(--urgente); }
  .subtitulo .cuando b { display: block; font-size: 32px; line-height: 36px; font-weight: 800; letter-spacing: -.02em; }
  .subtitulo .cuando span { font-size: 14px; color: var(--texto-2); font-weight: 650; }
  .subtitulo .frase { font-size: 22px; line-height: 30px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 10px; }
  .subtitulo .frase .quien-a, .subtitulo .frase .quien-por { font-weight: 800; }
  .subtitulo .cambios { display: flex; gap: 8px; flex-wrap: wrap; }
  .subtitulo .cambio { padding: 8px 12px; }
  .subtitulo .desde { grid-template-columns: 1fr; gap: 0; border: 1px solid var(--borde); border-radius: var(--r); }
  .subtitulo .desde > div { border: 0; border-radius: 0; grid-template-columns: 116px 1fr; align-items: center; padding: 6px 12px; }
  .subtitulo .desde > div + div { border-top: 1px solid var(--borde); }
  .subtitulo .desde .va { white-space: normal; }
  .sub-in.cambia { animation: fundido var(--t) var(--curva); }
  .teclas { position: absolute; right: 24px; top: 12px; display: flex; gap: 12px; font-size: 14px; color: var(--texto-3); font-weight: 600; }
  body.offline .top .pastilla { background: var(--urgente-suave); color: var(--urgente-texto); }
  .vacio-dia { position: absolute; inset: 0 0 32px 196px; display: grid; place-items: center; color: var(--texto-3); font-weight: 650; }
</style>

<script>
(function () {
  var AU = window.AU, $ = function (s) { return document.querySelector(s); };
  var DIAS = ["2026-10-28", "2026-10-29", "2026-10-30", "2026-10-31", "2026-11-02", "2026-11-03", "2026-11-04"];

  var CARRILES = ["anon", "rp", "gb", "ms", "sl", "no", "pg", "lf", "cr", "sys"];
  var dia = AU.HOY, acciones = [], sel = null, foco = null, t0 = 7, t1 = 11, carrilesVis = [];
  function min(a) { var h = a.hora.split(":"); return +h[0] + h[1] / 60; }

      var b = l.slice(0, 18).reverse().map(function (a) { return '<i class="' + AU.color(a) + '" style="height:' + (4 + (AU.color(a) ? 6 : 2)) + 'px"></i>'; }).join("");
      return '<button class="dia-b' + (d === dia ? " elegido" : "") + '" data-d="' + d + '" role="tab"><span class="d">' + CORTO[d] + ' · ' + l.length + '</span><span class="barras">' + b + '</span></button>';
    }).join("");
  }
  function x(t) { var w = $("#tablero").clientWidth - 196 - 24; return 196 + 12 + (t - t0) / (t1 - t0) * w; }

    var ts = acciones.map(min);
    t0 = Math.floor(Math.min.apply(null, ts.concat([9])) * 2) / 2 - .25; t1 = Math.ceil(Math.max.apply(null, ts.concat([10])) * 2) / 2 + .25;
    if (t1 - t0 < 3) t1 = t0 + 3;
    // Carriles: los que aparecen ese día, Alguien sin entrar arriba
    carrilesVis = CARRILES.filter(function (id) { return acciones.some(function (a) { return a.quien === id || AU.aQuien(a).some(function (q) { return q.id === id; }); }); });
    if (!carrilesVis.length) carrilesVis = ["rp"];
    var alto = ($("#tablero").clientHeight - 32) / carrilesVis.length;
    $("#carriles").style.gridTemplateRows = "repeat(" + carrilesVis.length + ", 1fr)";
    $("#carriles").innerHTML = carrilesVis.map(function (id) {
      var p = AU.P[id], n = acciones.filter(function (a) { return a.quien === id; }).length, r = acciones.filter(function (a) { return AU.aQuien(a).some(function (q) { return q.id === id; }); }).length;
      return '<div class="carril' + (id === "anon" ? " afuera" : "") + (p.estado ? " baja" : "") + (foco === id ? " foco" : "") + '" data-c="' + id + '"><div class="quien">' + AU.avatar(id, "chico") + '<span>' + AU.esc(p.nombre) + '<small>' + (id === "anon" ? n + (n === 1 ? " intento" : " intentos") : "hizo " + n + (r ? " · recibió " + r : "")) + '</small></span></div><div></div></div>';
    }).join("");

    for (var h = Math.ceil(t0); h <= Math.floor(t1); h++) { g += '<i style="left:' + (x(h) - 196) + 'px"></i>'; e += '<span style="left:' + (x(h) - 196) + 'px">' + h + ' h</span>'; }
    $("#rejilla").innerHTML = g; $("#eje").innerHTML = e;

    function y(id) { return (carrilesVis.indexOf(id) + .5) * alto; }
    acciones.forEach(function (a) {
      var c = AU.color(a), xx = x(min(a)), yy = y(a.quien);
      AU.aQuien(a).forEach(function (q) {
        if (carrilesVis.indexOf(q.id) < 0) return;
        var y2 = y(q.id), bend = Math.max(24, Math.abs(y2 - yy) * .35);

      });
      ph += '<button class="punto ' + c + '" data-id="' + a.id + '" style="left:' + xx + 'px;top:' + yy + 'px" title="' + a.hora + ' · ' + AU.esc(AU.textoPlano(a)) + '" aria-label="' + a.hora + '"></button>';
    });
    $("#puntos").innerHTML = ph; $("#flechas").innerHTML = fl;
    if (!acciones.length) $("#puntos").innerHTML = '<div class="vacio-dia">Ese día no se anotó nada</div>';
    if (!sel || !acciones.some(function (a) { return a.id === sel; })) sel = acciones.length ? acciones[acciones.length - 1].id : null;
    elegir(sel, false);
  }
  function visibles() { return acciones.filter(function (a) { return !foco || a.quien === foco || AU.aQuien(a).some(function (q) { return q.id === foco; }); }); }

  function cambioHTML(c) {
    var antes = c[1] === "—" ? '<span class="antes vacio">nada</span>' : '<span class="antes">' + AU.esc(c[1]) + '</span>';
    var despues = c[2] === "—" ? '<span class="despues" style="color:var(--error-texto)">ya no está</span>' : '<span class="despues">' + AU.esc(c[2]) + '</span>';
    return '<div class="cambio"><span class="campo-n">' + AU.esc(c[0]) + '</span><span class="ad">' + antes + '<i class="i i-s flecha-ad" data-i="arrow-right"></i>' + despues + '</span></div>';
  }
  function elegir(id, latir) {

    document.querySelectorAll(".punto").forEach(function (p) { var on = p.dataset.id === id || p.dataset.r === id; p.classList.toggle("sel", on); if (on && latir && p.dataset.id) { p.classList.remove("late"); void p.offsetWidth; p.classList.add("late"); } });
    document.querySelectorAll("#flechas path").forEach(function (p) { p.classList.toggle("sel", p.dataset.id === id); });
    var sub = $("#sub");
    if (!a) { sub.innerHTML = '<div></div><div class="t-cuerpo" style="color:var(--texto-3)">Elegí un día con acciones.</div><div></div>'; return; }
    $("#cabezal").style.transform = "translateX(" + x(min(a)) + "px)";
    $("#cab-hora").textContent = a.hora;
    sub.className = "subtitulo zona-red " + AU.color(a);
    var quien = a.quien === "anon" ? '<b style="color:var(--urgente-texto)">' + AU.esc(a.correo || "Alguien sin entrar") + '</b>' : a.quien === "sys" ? "<b>El sistema</b>" : '<button class="quien-por" data-foco="' + a.quien + '">' + AU.esc(AU.quienTexto(a)) + '</button>' + (AU.hoyDe(a) ? ' <span class="hoy">(hoy: ' + AU.esc(AU.hoyDe(a)) + ')</span>' : "");
    var t = AU.textoHTML(a, { marcas: true }).replace(/data-a=/g, "data-foco=");
    t = t.charAt(0).toLowerCase() + t.slice(1);
    var g = AU.GRUPOS.filter(function (z) { return z.id === a.grupo; })[0];
    sub.innerHTML = '<div class="cuando sub-in"><b>' + a.hora + '</b><span>' + (a.sinConfirmar ? "hora del celular, sin confirmar" : (a.dia === AU.HOY ? "hoy" : CORTO[a.dia]) + " · servidor") + '</span></div>' +
      '<div class="sub-in"><p class="frase">' + quien + ' ' + t + '</p><div class="cambios">' + '<span class="pastilla chica"><i class="i i-s" data-i="' + g.icono + '"></i>' + g.nombre + '</span>' + (AU.color(a) === "rojo" ? '<span class="pastilla error chica">Borra o saca</span>' : AU.color(a) === "ambar" ? '<span class="pastilla urgente chica">' + (a.grupo === "offline" ? "Sin confirmar" : "Rechazado") + '</span>' : "") + '</div><div class="cambios" style="margin-top:8px">' + a.cambios.map(cambioHTML).join("") + (a.nota || []).map(function (z) { return '<div class="cambio"><span class="campo-n">' + AU.esc(z[0]) + '</span><span class="ad">' + AU.esc(z[1]) + '</span></div>'; }).join("") + '</div></div>' +
      '<div class="desde sub-in"><div><span class="et"><i class="i i-s" data-i="' + AU.dispIcono(a) + '"></i>Dispositivo</span><span class="va">' + AU.dispTexto(a) + '</span></div><div><span class="et"><i class="i i-s" data-i="globe"></i>Navegador</span><span class="va">' + a.desde.nav + '</span></div><div><span class="et"><i class="i i-s" data-i="wifi"></i>Dirección</span><span class="va">' + a.desde.ip + '</span></div></div>';
    window.pintarIconos(sub);
  }
  function paso(d) {
    var v = visibles(), i = v.findIndex(function (a) { return a.id === sel; });
    if (i < 0) i = d > 0 ? -1 : v.length;
    var n = v[i + d]; if (n) { elegir(n.id, true); AU.vibrar(8); return true; } return false;
  }
  function aislar(id) { foco = foco === id ? null : id; render(); if (foco) { var v = visibles(); if (v.length && !v.some(function (a) { return a.id === sel; })) elegir(v[0].id, true); } }

  // Reproducir: el cabezal recorre el día y cada acción se enciende a su hora
  var jugando = false, raf = null;
  function play() {
    if (jugando) return parar();
    jugando = true; $("#play span").textContent = "Pausa"; $("#play svg").outerHTML = '<i class="i i-s" data-i="pause"></i>'; window.pintarIconos($("#play"));
    var v = visibles(); if (!v.length) return parar();
    var i = v.findIndex(function (a) { return a.id === sel; }); if (i >= v.length - 1) i = -1;
    var tt = i >= 0 ? min(v[i]) : t0, ultimo = null;
    var reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;

      else if (!reducido) { $("#cabezal").style.transform = "translateX(" + x(tt) + "px)"; $("#cab-hora").textContent = Math.floor(tt) + ":" + String(Math.floor((tt % 1) * 60)).padStart(2, "0"); }

  }
  function parar() { jugando = false; cancelAnimationFrame(raf); $("#play span").textContent = "Reproducir"; $("#play svg").outerHTML = '<i class="i i-s" data-i="play"></i>'; window.pintarIconos($("#play")); var a = acciones.filter(function (z) { return z.id === sel; })[0]; if (a) elegir(a.id, false); }
  $("#play").addEventListener("click", play);

  // Arrastrar el cabezal por el eje: se pega a la acción más cercana
  (function () {
    var z = $("#arrastre"), on = false;
    function mover(e) {

      var v = visibles(), mejor = null, d = 1e9;

  })();

  }, true);

      foco = carrilesVis[i] || null; render(); var v = visibles(); if (v.length && !v.some(function (a) { return a.id === sel; })) elegir(v[0].id, true);
    }

  });
