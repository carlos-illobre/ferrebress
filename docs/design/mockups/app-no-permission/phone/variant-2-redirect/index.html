<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin permiso · 2 · Te dejo en lo tuyo · celular</title>
<link rel="stylesheet" href="../../../../common/common.css">
<link rel="stylesheet" href="../../shared/frame.css">
<link rel="stylesheet" href="../../shared/stage.css">
<script src="../../../../common/icons.js"></script>
<script src="../../shared/icons-extra.js"></script>
<script src="../../../../common/navigate.js" defer></script>
<style>
  body { width: 390px; margin: 0; }
  .celu-pestanas[hidden] { display: none; }
  .celu-pantalla { position: relative; overflow: hidden; padding: 0; }
  .vista { position: absolute; inset: 0; overflow: auto; padding: 12px 16px 16px; display: grid; gap: 12px; align-content: start; background: var(--fondo); transition: transform var(--t-nav) var(--curva), opacity var(--t-nav) var(--curva); }
  .vista[hidden] { display: grid; visibility: hidden; pointer-events: none; }
  .vista.se-va { transform: translateX(100%); }
  .vista.llega { animation: llega var(--t-nav) var(--curva) both; }
  @keyframes llega { from { opacity: 0; transform: translateX(-30%); } to { opacity: 1; transform: none; } }
  .venta { padding: 16px; display: grid; gap: 10px; }
  .venta .cab { display: flex; justify-content: space-between; align-items: center; }
  .venta .total { font-size: 28px; font-weight: 800; }
  .peso { font-size: .6em; margin-right: 2px; }
  .pastilla.chica { height: 26px; padding: 0 10px; }
  .barra-accion .btn { width: 100%; }

  /* La isla: baja desde arriba como una notificación, se tira hacia arriba para cerrarla y se toca para abrirla */
  .isla { position: absolute; left: 8px; right: 8px; top: 48px; z-index: 30; background: var(--superficie); border: 1px solid var(--borde); border-radius: 22px; box-shadow: var(--sombra-3); transform: translateY(-140%); opacity: 0; transition: transform var(--t-nav) var(--rebote), opacity var(--t) var(--curva); touch-action: none; overflow: hidden; }
  .isla.ver { transform: none; opacity: 1; }
  .isla.arrastra { transition: none; }
  .isla .linea { display: grid; grid-template-columns: 40px minmax(0, 1fr) 24px; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
  .isla .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--hundido); display: grid; place-items: center; }
  .isla.perdido .ic { background: var(--urgente-suave); color: var(--urgente-texto); }
  .isla b { font-size: 15px; line-height: 20px; display: block; }
  .isla .linea span.d { font-size: 14px; line-height: 20px; color: var(--texto-2); display: block; }
  .isla .chev { color: var(--texto-3); transition: transform var(--t) var(--curva); }
  .isla.abierta .chev { transform: rotate(180deg); }
  .isla .cuerpo { padding: 0 14px 14px; display: grid; gap: 12px; }
  .isla .cuerpo[hidden] { display: none; }
  .isla.abierta .cuerpo { animation: abre var(--t) var(--curva) both; }
  @keyframes abre { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .rot { font-size: 14px; font-weight: 650; color: var(--texto-2); }
  .tiene { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 15px; font-weight: 700; border-top: 1px solid var(--borde); }
  .tiene .cara { width: 28px; height: 28px; }
  .mapa { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .parte { border-radius: 10px; padding: 8px 2px; display: grid; justify-items: center; gap: 2px; font-size: 14px; font-weight: 700; background: var(--pino-suave); color: var(--pino); }
  .parte.no { background: var(--hundido); color: var(--texto-3); }
  .parte.pedida { background: var(--superficie); border: 1.5px dashed var(--texto-3); color: var(--tinta); }
  .cuerpo .acc { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .asa-isla { width: 36px; height: 4px; border-radius: 99px; background: var(--hundido-2); margin: 0 auto 6px; }
</style>
</head>
<body>
<div class="celu">
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#1A1D1B" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#1A1D1B"/></svg></span></div>
  <div class="celu-cabecera"><span class="t-titulo" id="titulo">Vender</span></div>
  <button class="celu-estado"><span class="punto"></span><span>En línea · todo enviado</span></button>
  <nav class="celu-pestanas" id="pest-vender"><a class="activa" data-no-ir>Vender</a><a data-ir="today-sales">Ventas de hoy</a></nav>
  <nav class="celu-pestanas" id="pest-usuarios" hidden><a class="activa" data-no-ir>Usuarios</a><a data-no-ir>Auditoría</a></nav>

  <div class="celu-pantalla">
    <div class="vista" id="v-vender">
      <div class="tarjeta venta" id="venta">
        <div class="cab"><span class="t-renglon">Tu venta en curso</span><span class="pastilla logro chica"><i class="i i-s" data-i="check"></i>Intacta</span></div>
        <div class="fila-gris"><span class="bloque"></span><span class="lin"><span class="gris l"></span><span class="gris c"></span></span><span class="gris"></span></div>
        <div class="fila-gris"><span class="bloque"></span><span class="lin"><span class="gris m"></span><span class="gris c"></span></span><span class="gris"></span></div>
        <div class="fila-gris"><span class="bloque"></span><span class="lin"><span class="gris l"></span><span class="gris c"></span></span><span class="gris"></span></div>
        <div class="cab"><span class="t-detalle">3 renglones</span><span class="total"><span class="peso">$</span>48.000</span></div>
      </div>
    </div>
    <div class="vista" id="v-usuarios" hidden>
      <div class="fila-gris"><span class="bloque"></span><span class="lin"><span class="gris m"></span><span class="gris c"></span></span><span class="gris"></span></div>
      <div class="fila-gris"><span class="bloque"></span><span class="lin"><span class="gris l"></span><span class="gris c"></span></span><span class="gris"></span></div>
      <div class="fila-gris"><span class="bloque"></span><span class="lin"><span class="gris m"></span><span class="gris c"></span></span><span class="gris"></span></div>
      <div class="fila-gris"><span class="bloque"></span><span class="lin"><span class="gris c"></span><span class="gris m"></span></span><span class="gris"></span></div>
    </div>
  </div>

  <nav class="nav-inferior">
    <a data-ir="sales" id="m-vender" class="activo"><i class="i" data-i="shopping-cart"></i>Vender<span class="insignia">3</span></a>
    <a data-ir="products"><i class="i" data-i="tags"></i>Catálogo</a>
    <a data-ir="stock"><i class="i" data-i="package"></i>Depósito</a>
    <a data-ir="business-overview"><i class="i" data-i="chart-column"></i>Negocio</a>
    <a data-ir="more" id="m-mas"><i class="i" data-i="menu"></i>Más</a>
  </nav>
  <span class="home-ind"></span>

  <aside class="isla" id="isla" role="status" aria-live="polite">
    <div class="linea" id="isla-linea">
      <span class="ic"><i class="i" data-i="lock-keyhole"></i></span>
      <div><b id="isla-t">Usuarios no es parte de lo tuyo</b><span class="d" id="isla-d">Te dejé en Vender · tocá para ver más</span></div>
      <i class="i chev" data-i="chevron-down"></i>
    </div>
    <div class="cuerpo" id="cuerpo" hidden>
      <div class="rot">Hace falta «Ver las personas». Lo tienen:</div>
      <div id="tienen"></div>
      <div class="rot">Lo tuyo</div>
      <div class="mapa" id="mapa"></div>
      <div class="acc"><button class="btn" id="pedir"><i class="i i-s" data-i="share-2"></i>Pedírselo a Rubén o Graciela</button></div>
      <div class="asa-isla" aria-hidden="true"></div>
    </div>
  </aside>
</div>

<script src="../../shared/data.js"></script>
<script>
(function () {
  var D = window.NP, $ = function (id) { return document.getElementById(id); };
  var timers = [], state = "";
  $("tienen").innerHTML = D.holders.map(function (h) { return '<div class="tiene"><span>' + h.name + "</span>" + D.pila(h.people, 4) + "</div>"; }).join("");
  var parts = [["Vender", "shopping-cart", 1], ["Catálogo", "tags", 1], ["Depósito", "package", 1], ["Negocio", "lock", 0], ["Usuarios", "lock", 2]];
  $("mapa").innerHTML = parts.map(function (p) { return '<div class="parte' + (p[2] === 0 ? " no" : p[2] === 2 ? " pedida" : "") + '"><i class="i" data-i="' + p[1] + '"></i>' + p[0] + "</div>"; }).join("");
  window.pintarIconos($("isla"));

  function clear() { timers.forEach(clearTimeout); timers = []; }
  function isla(show, opts) {
    var el = $("isla");
    el.classList.remove("ver", "perdido", "abierta"); $("cuerpo").hidden = true; el.style.transform = "";
    if (!show) return;
    if (opts && opts.perdido) el.classList.add("perdido");
    void el.offsetWidth; el.classList.add("ver");
    if (opts && opts.cuenta) timers.push(setTimeout(function () { if (!el.classList.contains("abierta")) isla(false); }, 7000));
  }
  function toggle() { var el = $("isla"), o = !el.classList.contains("abierta"); el.classList.toggle("abierta", o); $("cuerpo").hidden = !o; }
  function setScreen(vend) {
    $("titulo").textContent = vend ? "Vender" : "Usuarios";
    $("pest-vender").hidden = !vend; $("pest-usuarios").hidden = vend;
    $("m-vender").classList.toggle("activo", vend); $("m-mas").classList.toggle("activo", !vend);
  }
  function enterVender() {
    var vv = $("v-vender"); vv.hidden = false; vv.classList.remove("llega"); void vv.offsetWidth; vv.classList.add("llega");
    setScreen(true);
    var v = $("venta"); v.classList.remove("recien"); void v.offsetWidth; v.classList.add("recien");
  }

  window.ESCENAS = {
    direccion: function () {
      clear(); state = "sin"; isla(false);
      $("v-usuarios").hidden = true; $("v-usuarios").classList.remove("se-va");
      $("isla-t").textContent = "No tenés permiso para Usuarios";
      $("isla-d").textContent = "Te dejé en Vender · tocá para ver más";
      enterVender();
      timers.push(setTimeout(function () { isla(true); STAGE.vibrate(10); }, 300));
    },
    perdido: function () {
      clear(); state = "usando"; isla(false);
      var vu = $("v-usuarios"); vu.classList.remove("se-va"); vu.hidden = false; $("v-vender").hidden = true; setScreen(false);
      timers.push(setTimeout(function () {
        state = "perdido";
        vu.classList.add("se-va");               // Usuarios se va hacia la derecha, como volver atrás
        enterVender();
        timers.push(setTimeout(function () { vu.hidden = true; }, 340));
        $("isla-t").textContent = "Ya no tenés permiso para Usuarios";
        $("isla-d").textContent = "Graciela te sacó «Encargado de turno» · tu venta sigue";
        timers.push(setTimeout(function () { isla(true, { perdido: true, cuenta: true }); STAGE.vibrate([10, 40, 10]); }, 200));
      }, 1400));
    }
  };

  // Tocar abre; tirar hacia arriba cierra
  var el = $("isla"), y0 = null, dy = 0, moved = false;
  $("isla-linea").addEventListener("pointerdown", function (e) { y0 = e.clientY; dy = 0; moved = false; el.classList.add("arrastra"); try { el.setPointerCapture(e.pointerId); } catch (x) {} });
  el.addEventListener("pointermove", function (e) { if (y0 === null) return; dy = Math.min(0, e.clientY - y0); if (dy < -4) moved = true; el.style.transform = "translateY(" + dy + "px)"; el.style.opacity = String(1 + dy / 160); });
  el.addEventListener("pointerup", function () {
    if (y0 === null) return; y0 = null; el.classList.remove("arrastra"); el.style.opacity = "";
    if (dy < -40) { isla(false); } else { el.style.transform = ""; if (!moved) toggle(); }
  });
  $("pedir").addEventListener("click", function () { D.copy(D.request); STAGE.toast("Pedido listo para mandar"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") isla(false); });
})();
</script>
<script src="../../shared/stage.js"></script>
</body>
</html>
