<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual · variante 1 · el libro · computadora</title>
<link rel="stylesheet" href="../../../../common/common.css">
<link rel="stylesheet" href="../../shared.css">
<script src="../../../../common/icons.js"></script>
<script src="../../shared.js"></script>
<script src="../../../../common/navigate.js" defer></script>
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .top { height: 68px; display: flex; align-items: center; gap: 24px; padding: 0 32px; background: var(--superficie); border-bottom: 1px solid var(--borde); position: relative; z-index: 5; }
  .top .marca-m { display: flex; align-items: center; gap: 12px; width: 236px; }
  .top .marca-m img { height: 26px; width: auto; }
  .top .marca-m span { font-weight: 800; font-size: 16px; color: var(--texto-2); padding-left: 12px; border-left: 1px solid var(--borde); }
  .buscar { position: relative; width: 380px; }
  .buscar .campo { height: 44px; color: var(--tinta); }
  .buscar input { border: 0; outline: 0; flex: 1; background: transparent; font-weight: 600; min-width: 0; }
  .buscar input::placeholder { color: var(--texto-3); font-weight: 500; }
  .buscar .campo:focus-within { border-color: var(--pino); box-shadow: 0 0 0 4px rgba(18,56,47,.12); }
  .resultados { position: absolute; top: 52px; left: 0; width: 480px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; box-shadow: var(--sombra-3); padding: 8px; opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity var(--t), transform var(--t) var(--curva); }
  .resultados.ver { opacity: 1; transform: none; pointer-events: auto; }
  .res { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer; }
  .res .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--pino-suave); color: var(--pino-texto); display: grid; place-items: center; }
  .res .cap { font-size: 14px; color: var(--texto-2); font-weight: 650; }
  .res .tit { font-weight: 750; }
  .res .sn { font-size: 14px; color: var(--texto-2); line-height: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .res.marcado { background: var(--hundido); }
  .res.es-pronto { cursor: default; opacity: .7; }
  .res-pie { padding: 8px 12px 4px; font-size: 14px; color: var(--texto-2); border-top: 1px solid var(--borde); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .res-pie button { border: 0; background: none; color: var(--pino-texto); font-weight: 750; padding: 0; }
  .res-vacio { padding: 16px; color: var(--texto-2); font-size: 15px; }
  .top .derecha { margin-left: auto; display: flex; gap: 12px; align-items: center; }

  .cuerpo { display: grid; grid-template-columns: 280px 1fr 252px; height: calc(100vh - 68px); }
  .indice { border-right: 1px solid var(--borde); overflow: auto; padding: 20px 16px 32px; }
  .parte { font-size: 14px; font-weight: 700; color: var(--texto-3); padding: 16px 12px 6px; }
  .cap-item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; font-weight: 650; color: var(--texto-2); }
  .cap-item .pronto { margin-left: auto; }
  .cap-item.listo { color: var(--tinta); cursor: pointer; }
  .cap-item.activo { background: var(--pino-suave); color: var(--pino); font-weight: 800; }
  .cap-item.apagado .i { opacity: .55; }
  .sub { display: grid; margin: 4px 0 8px 32px; border-left: 2px solid var(--borde); }
  .sub a { display: block; padding: 6px 12px; font-size: 14px; font-weight: 650; color: var(--texto-2); text-decoration: none; cursor: pointer; border-left: 2px solid transparent; margin-left: -2px; }
  .sub a.activo { color: var(--pino); border-left-color: var(--pino); font-weight: 800; }

  .lectura { overflow: auto; scroll-behavior: smooth; padding: 32px 40px 80px; }
  .articulo { max-width: 780px; margin: 0 auto; transition: opacity var(--t), transform var(--t) var(--curva); }
  .articulo.cambiando { opacity: 0; transform: translateY(8px); }
  .kicker { font-size: 14px; font-weight: 700; color: var(--pino-texto); display: flex; gap: 8px; align-items: center; }
  .articulo h1 { margin: 8px 0 8px; }
  .lead { font-size: 18px; line-height: 28px; color: var(--texto-2); max-width: 640px; margin: 0 0 24px; }
  .seccion { padding: 24px; margin-bottom: 16px; scroll-margin-top: 16px; }
  .seccion.destello { animation: destello 1.2s var(--curva); }
  @keyframes destello { 0% { box-shadow: 0 0 0 4px rgba(232,84,28,.45), var(--sombra-1); } 100% { box-shadow: 0 0 0 4px rgba(232,84,28,0), var(--sombra-1); } }
  .seccion header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .seccion header .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--pino-suave); color: var(--pino-texto); display: grid; place-items: center; }
  .seccion .s-lead { color: var(--texto-2); margin: 0 0 16px 52px; }
  .seccion .dos { display: grid; grid-template-columns: 1fr 400px; gap: 24px; align-items: start; }
  .seccion .dos.ancha { grid-template-columns: 1fr; }
  .pasos { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .paso { display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer; transition: background var(--t-micro); }
  .paso:hover { background: var(--hundido); }
  .paso.activo { background: var(--accion-suave); }
  .paso .n { width: 28px; height: 28px; border-radius: 99px; background: var(--pino); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; margin-top: -1px; }
  .paso.activo .n { background: var(--accion); }
  .paso .t { font-size: 16px; line-height: 24px; }
  .paso .ojo { display: inline-flex; vertical-align: -3px; color: var(--texto-3); margin-left: 4px; }
  .lado { position: sticky; top: 0; display: grid; gap: 8px; justify-items: center; }
  .lado .captura { width: 100%; }
  .lado .captura { cursor: zoom-in; }
  .lado .captura.celu-cap { width: 200px; margin-top: 6px; }
  .lupa { position: fixed; inset: 0; z-index: 50; background: rgba(26,29,27,.55); display: grid; place-items: center; opacity: 0; pointer-events: none; transition: opacity var(--t); }
  .lupa.ver { opacity: 1; pointer-events: auto; }
  .lupa .captura { width: min(1100px, 86vw); transform: scale(.96); transition: transform var(--t-nav) var(--curva); cursor: zoom-out; }
  .lupa .captura.celu-cap { width: 340px; }
  .lupa.ver .captura { transform: none; }
  .lupa .cerrar { position: absolute; top: 20px; right: 24px; }
  .lado .que { font-size: 14px; color: var(--texto-2); text-align: center; }
  .consejos { margin-top: 16px; display: grid; gap: 8px; }
  .clip-lugar { margin-top: 16px; }

  .rail { border-left: 1px solid var(--borde); padding: 28px 20px; overflow: auto; }
  .rail h3 { font-size: 14px; font-weight: 700; color: var(--texto-3); margin: 0 0 8px; }
  .rail a { display: block; padding: 6px 0; font-size: 14px; font-weight: 650; color: var(--texto-2); text-decoration: none; cursor: pointer; }
  .rail .tarjeta { padding: 16px; margin-top: 24px; display: grid; gap: 8px; }
  .rail .tarjeta .t-detalle { margin: 0; }
  .teclas { display: grid; gap: 8px; margin-top: 24px; }
  .teclas div { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--texto-2); }
</style>
</head>
<body>
<header class="top">
  <div class="marca-m"><img src="../../../../common/brand/logo-on-light.png" alt="Ferrebress"><span>Manual</span></div>
  <div class="segmentos" role="tablist" aria-label="Dispositivo">
    <button class="elegido" data-dev="desktop"><i class="i i-s" data-i="monitor"></i>Computadora <span class="kbd kbd-alt">C</span></button>
    <button data-dev="phone"><i class="i i-s" data-i="smartphone"></i>Celular <span class="kbd kbd-alt">L</span></button>
  </div>
  <div class="buscar">
    <label class="campo"><i class="i" data-i="search"></i><input id="q" placeholder="Buscá: huella, QR, salir…" autocomplete="off"><span class="kbd">/</span></label>
    <div class="resultados" id="res"></div>
  </div>
  <div class="derecha">
    <button class="btn" id="volver"><i class="i" data-i="arrow-left"></i>Volver a la entrada <span class="kbd">Esc</span></button>
  </div>
</header>
<div class="lupa" id="lupa"><button class="btn cerrar"><i class="i" data-i="x"></i>Cerrar <span class="kbd">Esc</span></button><div id="lupa-cap"></div></div>
<div class="cuerpo">
  <nav class="indice" id="indice" aria-label="Capítulos"></nav>
  <main class="lectura" id="lectura"><article class="articulo" id="art"></article></main>
  <aside class="rail">
    <h3>En este capítulo</h3>
    <div id="toc"></div>
    <div class="tarjeta">
      <span class="pastilla pino" id="donde" style="justify-self:start"><i class="i i-s" data-i="monitor"></i>En la computadora</span>
      <p class="t-detalle" id="donde-txt">Arrancó en la computadora porque es lo que estás usando. Para ver cómo es en el celular, elegí «Celular» arriba.</p>
    </div>
    <div class="teclas">
      <div><span class="kbd">/</span>Buscar</div>
      <div><span class="kbd">↑</span><span class="kbd">↓</span>Pasos de la parte</div>
      <div><span class="kbd">Alt</span>Ver las teclas</div>
      <div><span class="kbd">Esc</span>Volver</div>
    </div>
  </aside>
</div>
<script>
(function () {
  var M = window.MANUAL, dev = "desktop", lastQ = "";
  var art = document.getElementById("art"), indice = document.getElementById("indice"), toc = document.getElementById("toc");
  var q = document.getElementById("q"), res = document.getElementById("res"), lectura = document.getElementById("lectura");

  function capHTML(step) {
    if (step.ph) return '<div class="sin-captura" style="width:100%;min-height:170px"><i class="i i-xl" data-i="image"></i>Captura de la aplicación<br>' + step.ph + '</div>';
    var phone = step.cap.indexOf("phone") === 0;
    return '<div class="captura ' + (phone ? "celu-cap" : "") + '"><img src="' + M.cap(step.cap) + '" alt="' + (step.label || "") + '">' +
      (step.hot ? '<span class="punto-toque" style="left:' + step.hot[0] + '%;top:' + step.hot[1] + '%"></span>' : "") + '</div>' +
      '<div class="que">' + (step.label ? "Señalado: «" + step.label + "» · tocá para agrandar" : "") + '</div>';
  }
  function firstCap(s) { return s.steps.filter(function (x) { return x.cap || x.ph; })[0]; }

  function renderIndex() {
    var html = "", part = "";
    M.chapters.forEach(function (c) {
      if (c.part !== part) { part = c.part; html += '<div class="parte">' + part + '</div>'; }
      if (c.ready) {
        html += '<div class="cap-item listo activo"><i class="i" data-i="' + c.icon + '"></i>' + c.name + '</div><div class="sub">' +
          M.entrar[dev].sections.map(function (s, i) { return '<a data-sec="' + s.id + '"' + (i === 0 ? ' class="activo"' : "") + '>' + s.title + '</a>'; }).join("") + '</div>';
      } else html += '<div class="cap-item apagado" title="Todavía no está"><i class="i" data-i="' + c.icon + '"></i>' + c.name + '<span class="pronto">Pronto</span></div>';
    });
    indice.innerHTML = html;
  }
  function renderArticle() {
    var E = M.entrar[dev];
    var html = '<div class="kicker"><i class="i i-s" data-i="book-open"></i>Capítulo 1 · Antes de empezar</div><h1 class="t-titulo">Entrar</h1><p class="lead">' + E.lead + '</p>';
    E.sections.forEach(function (s) {
      var fc = firstCap(s);
      html += '<section class="seccion tarjeta" id="' + s.id + '"><header><span class="ico"><i class="i" data-i="' + s.icon + '"></i></span><h2 class="t-seccion" style="margin:0">' + s.title + '</h2>' +
        (s.tag ? '<span class="pastilla accion">' + s.tag + '</span>' : "") + '</header>' +
        (s.lead ? '<p class="s-lead">' + s.lead + '</p>' : '<div style="height:12px"></div>') +
        '<div class="dos' + (fc ? "" : " ancha") + '"><ol class="pasos">' +
        s.steps.map(function (st, i) { return '<li class="paso' + (st === fc ? " activo" : "") + '" data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="t">' + st.t + (st.cap || st.ph ? '<span class="ojo"><i class="i i-s" data-i="eye"></i></span>' : "") + '</span></li>'; }).join("") +
        '</ol>' + (fc ? '<div class="lado">' + capHTML(fc) + '</div>' : "") + '</div>' +
        (s.clip ? '<div class="clip-lugar">' + M.clipHTML() + '</div>' : "") +
        (s.tips ? '<div class="consejos">' + s.tips.map(function (t) { return '<div class="aviso pino"><i class="i i-s" data-i="info"></i><span>' + t + '</span></div>'; }).join("") + '</div>' : "") +
        '</section>';
    });
    html += '<div class="aviso" style="background:var(--hundido);color:var(--texto-2)"><i class="i i-s" data-i="book-open"></i><span>El próximo capítulo, «Vender», está por escribirse.</span></div>';
    art.innerHTML = html;
    toc.innerHTML = E.sections.map(function (s) { return '<a data-sec="' + s.id + '">' + s.title + '</a>'; }).join("");
    window.pintarIconos(document);
    M.wireClips(art);
    art.querySelectorAll(".seccion").forEach(function (sec) {
      var s = E.sections.filter(function (x) { return x.id === sec.id; })[0];
      sec.querySelectorAll(".paso").forEach(function (li) {
        li.addEventListener("click", function () { showStep(sec, s, +li.dataset.i); });
      });
    });
  }
  function showStep(sec, s, i) {
    var st = s.steps[i];
    sec.querySelectorAll(".paso").forEach(function (li) { li.classList.toggle("activo", +li.dataset.i === i); });
    if ((st.cap || st.ph) && sec.querySelector(".lado")) {
      var lado = sec.querySelector(".lado");
      lado.style.opacity = 0;
      setTimeout(function () { lado.innerHTML = capHTML(st); window.pintarIconos(lado); lado.style.opacity = 1; }, 120);
    }
  }
  function render() { renderIndex(); renderArticle(); window.pintarIconos(document); }

  function setDev(d, fromKey) {
    if (d === dev) return;
    dev = d;
    document.querySelectorAll("[data-dev]").forEach(function (b) { b.classList.toggle("elegido", b.dataset.dev === d); });
    art.classList.add("cambiando");
    setTimeout(function () { render(); lectura.scrollTop = 0; art.classList.remove("cambiando"); }, 160);
    var donde = document.getElementById("donde");
    donde.className = "pastilla " + (d === "desktop" ? "pino" : "urgente");
    donde.innerHTML = d === "desktop" ? '<i class="i i-s" data-i="monitor"></i>En la computadora' : '<i class="i i-s" data-i="smartphone"></i>Mirando el celular';
    window.pintarIconos(donde);
    document.getElementById("donde-txt").textContent = d === "desktop" ? "Arrancó en la computadora porque es lo que estás usando. Para ver cómo es en el celular, elegí «Celular» arriba." : "Estás mirando cómo se usa en el celular: el índice, los pasos y las capturas son los del celular.";
    if (q.value) doSearch();
  }
  document.querySelectorAll("[data-dev]").forEach(function (b) { b.addEventListener("click", function () { setDev(b.dataset.dev); }); });

  function goSection(id) {
    var el = document.getElementById(id); if (!el) return;
    el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    el.classList.remove("destello"); void el.offsetWidth; el.classList.add("destello");
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-sec]"); if (a) goSection(a.dataset.sec);
  });
  lectura.addEventListener("scroll", function () {
    var cur = null;
    art.querySelectorAll(".seccion").forEach(function (s) { if (s.offsetTop - lectura.scrollTop < 160) cur = s.id; });
    document.querySelectorAll(".sub a, .rail a").forEach(function (a) { a.classList.toggle("activo", a.dataset.sec === cur); a.style.color = a.dataset.sec === cur && a.closest(".rail") ? "var(--pino)" : ""; });
  });

  /* Buscador */
  var marked = 0, results = [];
  function doSearch() {
    var v = q.value; lastQ = v; results = M.search(dev, v); marked = 0;
    if (v.trim().length < 2) { res.classList.remove("ver"); return; }
    var html = results.length ? results.map(function (r, i) {
      if (r.pronto) return '<div class="res es-pronto"><span class="ico" style="background:var(--hundido);color:var(--texto-3)"><i class="i i-s" data-i="book-open"></i></span><div><div class="tit">' + M.mark(r.chapter, v) + '</div><div class="sn">Capítulo por escribir</div></div><span class="pronto">Pronto</span></div>';
      return '<div class="res' + (i === 0 ? " marcado" : "") + '" data-go="' + r.section.id + '"><span class="ico"><i class="i i-s" data-i="' + r.section.icon + '"></i></span><div><div class="cap">Entrar › ' + r.section.title + '</div><div class="sn">' + M.mark(r.snippet, v) + '</div></div><span class="kbd">' + (i === 0 ? "Enter" : "↵") + '</span></div>';
    }).join("") : '<div class="res-vacio">No hay nada sobre «' + v + '» en el manual de la ' + (dev === "desktop" ? "computadora" : "celular") + '.</div>';
    var other = M.otherDeviceCount(dev, v);
    if (other) html += '<div class="res-pie"><i class="i i-s" data-i="' + (dev === "desktop" ? "smartphone" : "monitor") + '"></i>' + other + ' más en el manual del ' + (dev === "desktop" ? "celular" : "de la computadora") + ' <button id="cambiar">Ver</button></div>';
    res.innerHTML = html; window.pintarIconos(res); res.classList.add("ver");
  }
  q.addEventListener("input", function () { clearTimeout(q._t); q._t = setTimeout(doSearch, 150); });
  q.addEventListener("focus", function () { if (q.value.trim().length > 1) doSearch(); });
  q.addEventListener("blur", function () { setTimeout(function () { res.classList.remove("ver"); }, 150); });
  res.addEventListener("mousedown", function (e) {
    var r = e.target.closest("[data-go]"); if (r) { e.preventDefault(); pick(r.dataset.go); }
    if (e.target.id === "cambiar") { e.preventDefault(); setDev(dev === "desktop" ? "phone" : "desktop"); setTimeout(doSearch, 200); }
  });
  function pick(id) { res.classList.remove("ver"); q.blur(); goSection(id); }
  q.addEventListener("keydown", function (e) {
    var items = res.querySelectorAll("[data-go]");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!items.length) return;
      marked = (marked + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      items.forEach(function (it, i) { it.classList.toggle("marcado", i === marked); });
    } else if (e.key === "Enter" && items[marked]) pick(items[marked].dataset.go);
    else if (e.key === "Escape") { e.stopPropagation(); q.value = ""; res.classList.remove("ver"); q.blur(); }
  });

  /* Teclado */
  M.altKeys();
  document.addEventListener("keydown", function (e) {
    if (e.altKey && (e.key === "c" || e.key === "C")) { e.preventDefault(); setDev("desktop"); }
    if (e.altKey && (e.key === "l" || e.key === "L")) { e.preventDefault(); setDev("phone"); }
    if (document.activeElement === q) return;
    if (e.key === "/") { e.preventDefault(); q.focus(); }
    if (e.key === "Escape") { if (lupa.classList.contains("ver")) { lupa.classList.remove("ver"); return; } document.getElementById("volver").click(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      var secs = Array.prototype.slice.call(art.querySelectorAll(".seccion"));
      var idx = secs.findIndex(function (s) { return s.offsetTop - lectura.scrollTop >= -8; });
      e.preventDefault();
      var next = e.key === "ArrowDown" ? Math.min(secs.length - 1, idx + (secs[idx] && secs[idx].offsetTop - lectura.scrollTop < 40 ? 1 : 0)) : Math.max(0, idx - 1);
      if (secs[next]) goSection(secs[next].id);
    }
  });
  var lupa = document.getElementById("lupa");
  art.addEventListener("click", function (e) {
    var c = e.target.closest(".lado .captura"); if (!c) return;
    document.getElementById("lupa-cap").innerHTML = c.outerHTML; lupa.classList.add("ver");
  });
  lupa.addEventListener("click", function () { lupa.classList.remove("ver"); });
  document.getElementById("volver").addEventListener("click", function () { M.toast("Vuelve a la entrada, donde estabas"); });

  render();
})();
</script>
</body>
</html>
