<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual · variante 1 · el libro · celular</title>
<link rel="stylesheet" href="../../../../common/common.css">
<link rel="stylesheet" href="../../shared.css">
<script src="../../../../common/icons.js"></script>
<script src="../../shared.js"></script>
<script src="../../../../common/navigate.js" defer></script>
<style>
  body { width: 390px; }
  .celu { overflow: hidden; }
  .vista { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: var(--fondo); transition: transform var(--t-nav) var(--curva), opacity var(--t-nav); }
  .vista.capitulo { transform: translateX(100%); box-shadow: -12px 0 32px -16px rgba(26,29,27,.3); }
  .celu.en-cap .vista.capitulo { transform: none; }
  .celu.en-cap .vista.indice-v { transform: translateX(-24%); opacity: .6; }
  .atras { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; border: 0; background: none; color: var(--pino-texto); font-weight: 700; font-size: 16px; }
  .cab { padding: 0 16px; }
  .cab h1 { margin: 0 0 12px; }
  .seg-full { display: flex; width: 100%; }
  .seg-full > * { flex: 1; justify-content: center; min-height: 40px; }
  .campo { height: 48px; margin-top: 12px; color: var(--tinta); }
  .campo input { border: 0; outline: 0; flex: 1; background: transparent; font-weight: 600; min-width: 0; }
  .campo:focus-within { border-color: var(--pino); box-shadow: 0 0 0 4px rgba(18,56,47,.12); }
  .scroll { flex: 1; overflow: auto; padding: 8px 16px 32px; }
  .parte { font-size: 14px; font-weight: 700; color: var(--texto-3); margin: 16px 4px 8px; }
  .grupo { background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; box-shadow: var(--sombra-1); overflow: hidden; }
  .fila { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px; min-height: 56px; padding: 8px 12px; }
  .fila + .fila { border-top: 1px solid var(--borde); }
  .fila .ico { width: 40px; height: 40px; border-radius: 12px; background: var(--hundido); color: var(--texto-3); display: grid; place-items: center; }
  .fila.listo .ico { background: var(--pino-suave); color: var(--pino-texto); }
  .fila .n { font-weight: 700; }
  .fila .d { font-size: 14px; color: var(--texto-2); line-height: 18px; }
  .fila.apagado .n { color: var(--texto-2); }
  .fila.listo:active { background: var(--hundido); }
  .destacado { padding: 16px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-top: 8px; }
  .destacado .t-etiqueta { color: var(--pino-texto); }
  /* capítulo */
  .cap-cab { display: flex; align-items: center; padding: 0 8px; height: 48px; border-bottom: 1px solid var(--borde); background: rgba(244,242,236,.92); }
  .cap-cab .dev { margin-left: auto; margin-right: 8px; }
  .saltos { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; scrollbar-width: none; border-bottom: 1px solid var(--borde); }
  .saltos::-webkit-scrollbar { display: none; }
  .saltos button { flex: none; height: 36px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--borde-fuerte); background: var(--superficie); font-weight: 650; font-size: 14px; }
  .saltos button.elegido { background: var(--pino); border-color: var(--pino); color: #fff; }
  .lead { font-size: 16px; line-height: 24px; color: var(--texto-2); margin: 4px 0 16px; }
  .seccion { padding: 16px; margin-bottom: 12px; scroll-margin-top: 8px; }
  .seccion.destello { animation: destello 1.2s var(--curva); }
  @keyframes destello { 0% { box-shadow: 0 0 0 4px rgba(232,84,28,.45); } 100% { box-shadow: 0 0 0 4px rgba(232,84,28,0); } }
  .seccion h2 { margin: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pasos { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
  .paso { display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
  .paso .n { width: 28px; height: 28px; border-radius: 99px; background: var(--pino); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
  .paso .cap-paso { grid-column: 2; margin-top: 8px; }
  .cap-paso .captura.celu-cap { width: 172px; margin: 8px auto 10px; }
  .consejos { display: grid; gap: 8px; margin-top: 16px; }
  .clip-lugar { margin-top: 16px; }
  .res { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 12px; }
  .res + .res { border-top: 1px solid var(--borde); }
  .res .c { font-size: 14px; font-weight: 700; color: var(--pino-texto); }
  .res .s { font-size: 15px; line-height: 21px; }
  .vacio { text-align: center; color: var(--texto-2); padding: 32px 16px; }
  .otro { margin-top: 12px; font-size: 14px; color: var(--texto-2); display: flex; gap: 8px; align-items: center; }
  .otro button { border: 0; background: none; color: var(--pino-texto); font-weight: 750; padding: 0; }
</style>
</head>
<body>
<div class="celu" id="celu">
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#1A1D1B" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#1A1D1B"/></svg></span></div>

  <section class="vista indice-v">
    <div class="cab">
      <button class="atras" data-ir="more"><i class="i i-l" data-i="chevron-left"></i>Más</button>
      <h1 class="t-titulo">Manual</h1>
      <div class="segmentos seg-full"><button data-dev="desktop"><i class="i i-s" data-i="monitor"></i>Computadora</button><button class="elegido" data-dev="phone"><i class="i i-s" data-i="smartphone"></i>Celular</button></div>
      <label class="campo"><i class="i" data-i="search"></i><input id="q" placeholder="Buscar en el manual" autocomplete="off"><button id="limpiar" class="btn btn-fantasma chico btn-icono" style="display:none" aria-label="Borrar"><i class="i i-s" data-i="x"></i></button></label>
    </div>
    <div class="scroll" id="lista"></div>
  </section>

  <section class="vista capitulo">
    <div class="cap-cab"><button class="atras" id="a-indice"><i class="i i-l" data-i="chevron-left"></i>Manual</button><span class="pastilla contorno dev" id="cap-dev"></span></div>
    <div class="saltos" id="saltos"></div>
    <div class="scroll" id="cap"></div>
  </section>
  <span class="home-ind"></span>
</div>
<script>
(function () {
  var M = window.MANUAL, dev = "phone";
  var celu = document.getElementById("celu"), lista = document.getElementById("lista"), cap = document.getElementById("cap"), q = document.getElementById("q");

  function renderIndex() {
    var html = '<button class="tarjeta destacado" style="width:100%;text-align:left;border:1px solid var(--borde)" data-open=""><div><div class="t-etiqueta">Empezá por acá</div><div class="t-renglon">Entrar</div><div class="t-detalle">' + M.chapters[0].desc[dev] + '</div></div><span class="btn btn-oscuro btn-icono"><i class="i" data-i="arrow-right"></i></span></button>';
    var part = "", open = false;
    M.chapters.slice(1).forEach(function (c) {
      if (c.part !== part) { if (open) html += '</div>'; part = c.part; html += '<div class="parte">' + part + '</div><div class="grupo">'; open = true; }
      html += '<div class="fila apagado"><span class="ico"><i class="i" data-i="' + c.icon + '"></i></span><span class="n">' + c.name + '</span><span class="pronto">Pronto</span></div>';
    });
    html += '</div>';
    lista.innerHTML = html; window.pintarIconos(lista);
  }
  function capHTML(st) {
    if (st.ph) return '<div class="sin-captura" style="min-height:120px"><i class="i i-xl" data-i="image"></i>Captura: ' + st.ph + '</div>';
    var phone = st.cap.indexOf("phone") === 0;
    return '<div class="captura ' + (phone ? "celu-cap" : "") + '"><img src="' + M.cap(st.cap) + '" alt="' + (st.label || "") + '">' + (st.hot ? '<span class="punto-toque" style="left:' + st.hot[0] + '%;top:' + st.hot[1] + '%"></span>' : "") + '</div>';
  }
  function renderChapter() {
    var E = M.entrar[dev];
    document.getElementById("cap-dev").innerHTML = '<i class="i i-s" data-i="' + (dev === "phone" ? "smartphone" : "monitor") + '"></i>' + (dev === "phone" ? "Celular" : "Computadora");
    document.getElementById("saltos").innerHTML = E.sections.map(function (s, i) { return '<button data-sec="' + s.id + '"' + (i ? "" : ' class="elegido"') + '>' + s.title + '</button>'; }).join("");
    var html = '<h1 class="t-titulo" style="margin:8px 0 0">Entrar</h1><p class="lead">' + E.lead + '</p>';
    E.sections.forEach(function (s) {
      html += '<section class="seccion tarjeta" id="' + s.id + '"><h2 class="t-seccion">' + s.title + (s.tag ? ' <span class="pastilla accion">' + s.tag + '</span>' : "") + '</h2>' +
        (s.lead ? '<p class="t-detalle" style="margin:4px 0 0">' + s.lead + '</p>' : "") +
        '<ol class="pasos">' + s.steps.map(function (st, i) { return '<li class="paso"><span class="n">' + (i + 1) + '</span><span>' + st.t + '</span>' + (st.cap || st.ph ? '<div class="cap-paso">' + capHTML(st) + '</div>' : "") + '</li>'; }).join("") + '</ol>' +
        (s.clip ? '<div class="clip-lugar">' + M.clipHTML() + '</div>' : "") +
        (s.tips ? '<div class="consejos">' + s.tips.map(function (t) { return '<div class="aviso pino"><i class="i i-s" data-i="info"></i><span>' + t + '</span></div>'; }).join("") + '</div>' : "") +
        '</section>';
    });
    cap.innerHTML = html; window.pintarIconos(document); M.wireClips(cap);
  }
  function openChapter(sec) {
    renderChapter(); cap.scrollTop = 0; celu.classList.add("en-cap");
    if (sec) setTimeout(function () { goSection(sec); }, 340);
  }
  function goSection(id) {
    var el = document.getElementById(id); if (!el) return;
    cap.scrollTo({ top: el.offsetTop - 8, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    el.classList.remove("destello"); void el.offsetWidth; el.classList.add("destello");
  }
  cap.addEventListener("scroll", function () {
    var cur = null; cap.querySelectorAll(".seccion").forEach(function (s) { if (s.offsetTop - cap.scrollTop < 120) cur = s.id; });
    document.querySelectorAll("#saltos button").forEach(function (b) { var on = b.dataset.sec === (cur || M.entrar[dev].sections[0].id); if (on && !b.classList.contains("elegido")) b.scrollIntoView({ inline: "center", block: "nearest" }); b.classList.toggle("elegido", on); });
  });
  document.getElementById("saltos").addEventListener("click", function (e) { var b = e.target.closest("[data-sec]"); if (b) goSection(b.dataset.sec); });
  document.getElementById("a-indice").addEventListener("click", function () { celu.classList.remove("en-cap"); });
  lista.addEventListener("click", function (e) {
    var o = e.target.closest("[data-open]"); if (o) openChapter(o.dataset.open);
    if (e.target.closest("#cambiar")) setDev(dev === "phone" ? "desktop" : "phone");
  });
  document.querySelectorAll("[data-dev]").forEach(function (b) { b.addEventListener("click", function () { setDev(b.dataset.dev); }); });
  function setDev(d) {
    dev = d; document.querySelectorAll("[data-dev]").forEach(function (b) { b.classList.toggle("elegido", b.dataset.dev === d); });
    lista.style.opacity = 0; setTimeout(function () { q.value ? search() : renderIndex(); lista.style.opacity = 1; }, 120);
  }
  lista.style.transition = "opacity 120ms";

  function search() {
    var v = q.value; document.getElementById("limpiar").style.display = v ? "" : "none";
    if (v.trim().length < 2) { renderIndex(); return; }
    var r = M.search(dev, v), html;
    if (!r.length) html = '<div class="vacio"><i class="i i-xl" data-i="search"></i><p>Nada sobre «' + v + '» en el manual del ' + (dev === "phone" ? "celular" : "de la computadora") + '.</p></div>';
    else html = '<div class="parte">' + r.filter(function (x) { return !x.pronto; }).length + ' en el manual del ' + (dev === "phone" ? "celular" : "de la computadora") + '</div><div class="grupo">' + r.map(function (x) {
      if (x.pronto) return '<div class="res"><div><div class="c" style="color:var(--texto-3)">' + M.mark(x.chapter, v) + '</div><div class="s t-detalle">Capítulo por escribir</div></div><span class="pronto">Pronto</span></div>';
      return '<div class="res" data-open="' + x.section.id + '"><div><div class="c">Entrar › ' + x.section.title + '</div><div class="s">' + M.mark(x.snippet, v) + '</div></div><i class="i" data-i="chevron-right"></i></div>';
    }).join("") + '</div>';
    var other = M.otherDeviceCount(dev, v);
    if (other) html += '<div class="otro"><i class="i i-s" data-i="' + (dev === "phone" ? "monitor" : "smartphone") + '"></i>' + other + ' más en el de la ' + (dev === "phone" ? "computadora" : "celular") + ' <button id="cambiar">Ver</button></div>';
    lista.innerHTML = html; window.pintarIconos(lista);
  }
  q.addEventListener("input", function () { clearTimeout(q._t); q._t = setTimeout(search, 150); });
  document.getElementById("limpiar").addEventListener("click", function (e) { e.preventDefault(); q.value = ""; search(); });

  /* gesto: deslizar desde el borde izquierdo vuelve al índice, como en iPhone */
  var sx = null; cap.parentNode.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX < 30 ? e.touches[0].clientX : null; }, { passive: true });
  cap.parentNode.addEventListener("touchend", function (e) { if (sx !== null && e.changedTouches[0].clientX - sx > 80) celu.classList.remove("en-cap"); sx = null; });

  renderIndex();
})();
</script>
</body>
</html>
