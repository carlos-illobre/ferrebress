<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual · variante 2 · paso a paso · celular</title>
<link rel="stylesheet" href="../../../../common/common.css">
<link rel="stylesheet" href="../../shared.css">
<script src="../../../../common/icons.js"></script>
<script src="../../shared.js"></script>
<script src="../../../../common/navigate.js" defer></script>
<style>
  body { width: 390px; }
  .vista { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; background: var(--fondo); transition: transform var(--t-nav) var(--curva), opacity var(--t-nav); }
  .guia-v { transform: translateY(100%); background: var(--superficie); border-radius: 24px 24px 0 0; box-shadow: var(--sombra-3); top: 52px; }
  .celu.en-guia .guia-v { transform: none; }
  .celu.en-guia .tareas-v { transform: scale(.94); opacity: .5; }
  .atras { display: inline-flex; align-items: center; gap: 2px; height: 44px; padding: 0 8px 0 4px; border: 0; background: none; color: var(--pino-texto); font-weight: 700; font-size: 16px; }
  .cab { padding: 0 16px; }
  .cab h1 { margin: 0 0 12px; }
  .seg-full { display: flex; width: 100%; } .seg-full > * { flex: 1; justify-content: center; min-height: 40px; }
  .campo { height: 48px; margin-top: 12px; color: var(--tinta); }
  .campo input { border: 0; outline: 0; flex: 1; background: transparent; font-weight: 600; min-width: 0; }
  .campo:focus-within { border-color: var(--pino); box-shadow: 0 0 0 4px rgba(18,56,47,.12); }
  .scroll { flex: 1; overflow: auto; padding: 4px 16px 32px; }
  .grupo-t { font-size: 14px; font-weight: 700; color: var(--texto-3); margin: 16px 4px 8px; }
  .tarea { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; box-shadow: var(--sombra-1); }
  .tarea + .tarea { margin-top: 8px; }
  .tarea:active { transform: scale(.98); }
  .tarea .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--pino-suave); color: var(--pino-texto); display: grid; place-items: center; }
  .tarea .n { font-weight: 750; }
  .tarea .d { font-size: 14px; color: var(--texto-2); }
  .proximo { display: flex; flex-wrap: wrap; gap: 8px; }
  .proximo span { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; background: var(--hundido); color: var(--texto-2); font-size: 14px; font-weight: 650; }
  .otro { font-size: 14px; color: var(--texto-2); padding: 12px 4px; display: flex; gap: 8px; align-items: center; }
  .otro button { border: 0; background: none; padding: 0; color: var(--pino-texto); font-weight: 750; }
  /* guía */
  .g-cab { display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 16px; }
  .g-cab .t-renglon { flex: 1; }
  .barras { display: flex; gap: 4px; padding: 12px 16px 0; }
  .barras b { flex: 1; height: 4px; border-radius: 99px; background: var(--hundido-2); position: relative; overflow: hidden; }
  .barras b::after { content: ""; position: absolute; inset: 0; background: var(--accion); transform: scaleX(0); transform-origin: left; transition: transform var(--t-nav) var(--curva); }
  .barras b.hecho::after { transform: scaleX(1); }
  .escena { position: relative; flex: 1; min-height: 0; margin: 12px 16px 0; border-radius: 20px; background: var(--hundido); overflow: hidden; touch-action: pan-y; }
  .capa { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; transition: opacity var(--t-nav), transform var(--t-nav) var(--curva); }
  .capa.entra { opacity: 0; transform: translateX(32px); }
  .capa.sale { opacity: 0; transform: translateX(-32px); }
  .capa .captura.celu-cap { height: 100%; width: auto; aspect-ratio: 374 / 828; }
  .capa .captura.celu-cap img { height: 100%; width: auto; }
  .capa .captura.compu { width: 100%; }
  .capa .sin-captura { width: 100%; height: 100%; }
  .velo { position: absolute; inset: 0; background: rgba(236,233,225,.7); display: grid; place-items: center; }
  .velo .grande { width: 96px; height: 96px; border-radius: 99px; background: var(--superficie); box-shadow: var(--sombra-3); display: grid; place-items: center; color: var(--pino); animation: entra-ico 420ms var(--rebote); }
  .velo .grande .i { width: 44px; height: 44px; }
  @keyframes entra-ico { from { transform: scale(.7); opacity: 0; } }
  .capa .clip { width: 100%; }
  .texto { padding: 16px 16px 0; display: grid; grid-template-columns: 40px 1fr; gap: 12px; min-height: 120px; align-content: start; }
  .texto .n { width: 40px; height: 40px; border-radius: 99px; background: var(--pino); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; }
  .texto .f { font-size: 18px; line-height: 26px; font-weight: 700; }
  .texto .tip { grid-column: 1 / -1; }
  .botones { display: grid; grid-template-columns: 56px 1fr; gap: 8px; padding: 12px 16px 28px; }
</style>
</head>
<body>
<div class="celu" id="celu">
  <div class="barra-estado"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#1A1D1B" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#1A1D1B"/></svg></span></div>
  <section class="vista tareas-v">
    <div class="cab">
      <button class="atras" data-ir="more"><i class="i i-l" data-i="chevron-left"></i>Más</button>
      <h1 class="t-titulo">¿Qué querés hacer?</h1>
      <div class="segmentos seg-full"><button data-dev="desktop"><i class="i i-s" data-i="monitor"></i>Computadora</button><button class="elegido" data-dev="phone"><i class="i i-s" data-i="smartphone"></i>Celular</button></div>
      <label class="campo"><i class="i" data-i="search"></i><input id="q" placeholder="Ej.: entrar sin internet" autocomplete="off"></label>
    </div>
    <div class="scroll" id="lista"></div>
  </section>
  <section class="vista guia-v" aria-hidden="true">
    <div class="g-cab"><span class="t-renglon" id="g-tit"></span><button class="btn chico" id="ver-clip"><i class="i i-s" data-i="zap"></i>Clip</button><button class="btn btn-fantasma btn-icono" id="cerrar" aria-label="Cerrar"><i class="i i-l" data-i="x"></i></button></div>
    <div class="barras" id="barras"></div>
    <div class="escena" id="esc"></div>
    <div class="texto" id="texto"></div>
    <div class="botones"><button class="btn btn-icono grande" id="ant" aria-label="Anterior" style="width:56px"><i class="i" data-i="arrow-left"></i></button><button class="btn btn-accion grande" id="sig">Siguiente</button></div>
  </section>
  <span class="home-ind"></span>
</div>
<script>
(function () {
  var M = window.MANUAL, dev = "phone", sec = null, step = 0, lastCap = null;
  var celu = document.getElementById("celu"), lista = document.getElementById("lista"), esc = document.getElementById("esc"), q = document.getElementById("q");
  function sections() { return M.entrar[dev].sections; }
  function renderList() {
    var v = q.value.trim(), html = "";
    if (v.length >= 2) {
      var r = M.search(dev, v), found = r.filter(function (x) { return !x.pronto; });
      html += '<div class="grupo-t">' + (found.length ? found.length + " encontradas" : "No encontré «" + v + "»") + '</div>' + found.map(function (x) { return task(x.section, M.mark(x.snippet, v)); }).join("");
      var pr = r.filter(function (x) { return x.pronto; }); if (pr.length) html += '<div class="proximo" style="margin-top:12px">' + pr.map(function (x) { return '<span>' + x.chapter + ' · pronto</span>'; }).join("") + '</div>';
      var o = M.otherDeviceCount(dev, v); if (o) html += '<div class="otro"><i class="i i-s" data-i="monitor"></i>' + o + ' en el de la ' + (dev === "phone" ? "computadora" : "celular") + ' <button id="cambiar">Ver</button></div>';
    } else {
      html += '<div class="grupo-t">Entrar</div>' + sections().map(function (s) { return task(s); }).join("");
      html += '<div class="grupo-t" style="margin-top:24px">Próximos capítulos</div><div class="proximo">' + M.chapters.filter(function (c) { return !c.ready; }).map(function (c) { return '<span><i class="i i-s" data-i="' + c.icon + '"></i>' + c.name + '</span>'; }).join("") + '</div>';
    }
    lista.innerHTML = html; window.pintarIconos(lista);
  }
  function task(s, sn) {
    return '<div class="tarea" data-sec="' + s.id + '"><span class="ico"><i class="i i-l" data-i="' + s.icon + '"></i></span><div><div class="n">' + s.title + '</div><div class="d">' + (sn || (s.steps.length + " pasos" + (s.clip ? " · con clip" : "") + (s.tag ? ' · <b style="color:var(--accion-texto)">la más rápida</b>' : ""))) + '</div></div><i class="i" data-i="chevron-right" style="color:var(--texto-3)"></i></div>';
  }
  function layer(st) {
    if (st.cap) { lastCap = st; var p = st.cap.indexOf("phone") === 0;
      return '<div class="captura ' + (p ? "celu-cap" : "compu") + '"><img src="' + M.cap(st.cap) + '" alt=""><span class="punto-toque" style="left:' + st.hot[0] + '%;top:' + st.hot[1] + '%"></span><span class="punto-rotulo' + (st.hot[0] > 65 ? ' der' : st.hot[0] < 35 ? ' izq' : '') + '" style="left:' + st.hot[0] + '%;top:' + st.hot[1] + '%">' + st.label + '</span></div>'; }
    if (st.ph) { lastCap = null; return '<div class="sin-captura"><i class="i i-xl" data-i="image"></i>Captura: ' + st.ph + '</div>'; }
    var bg = lastCap ? '<div class="captura ' + (lastCap.cap.indexOf("phone") === 0 ? "celu-cap" : "compu") + '"><img src="' + M.cap(lastCap.cap) + '" alt=""></div>' : "";
    return bg + '<div class="velo"' + (bg ? "" : ' style="background:none"') + '><span class="grande"><i class="i" data-i="' + M.stepIcon(st, sec) + '"></i></span></div>';
  }
  function show(dir) {
    var st = sec.steps[step], old = esc.querySelector(".capa");
    var l = document.createElement("div"); l.className = "capa" + (dir ? " entra" : ""); if (dir < 0) l.style.transform = "translateX(-32px)";
    l.innerHTML = layer(st); esc.appendChild(l); window.pintarIconos(l);
    if (old) { old.classList.add("sale"); if (dir < 0) old.style.transform = "translateX(32px)"; setTimeout(function () { old.remove(); }, 320); }
    requestAnimationFrame(function () { requestAnimationFrame(function () { l.classList.remove("entra"); l.style.transform = ""; }); });
    document.getElementById("barras").innerHTML = sec.steps.map(function (_, i) { return '<b' + (i <= step ? ' class="hecho"' : "") + '></b>'; }).join("");
    var tips = sec.tips || [];
    document.getElementById("texto").innerHTML = '<span class="n">' + (step + 1) + '</span><span class="f">' + st.t + '</span>' + (tips.length && step === sec.steps.length - 1 ? '<div class="tip aviso pino"><i class="i i-s" data-i="info"></i><span>' + tips[0] + '</span></div>' : "");
    window.pintarIconos(document.getElementById("texto"));
    var last = step === sec.steps.length - 1, next = sections()[sections().indexOf(sec) + 1];
    document.getElementById("sig").textContent = last ? (next ? "Seguir: " + next.title : "Terminé") : "Siguiente";
    document.getElementById("ant").disabled = step === 0;
  }
  function open(s) {
    sec = s; step = 0; lastCap = null; esc.innerHTML = "";
    document.getElementById("g-tit").textContent = s.title;
    document.getElementById("ver-clip").style.display = s.clip ? "" : "none";
    show(0); celu.classList.add("en-guia");
  }
  function go(d) {
    if (d > 0 && step < sec.steps.length - 1) { step++; show(1); }
    else if (d > 0) { var n = sections()[sections().indexOf(sec) + 1]; if (n) open(n); else celu.classList.remove("en-guia"); }
    else if (d < 0 && step > 0) { step--; show(-1); }
  }
  document.getElementById("sig").addEventListener("click", function () { go(1); });
  document.getElementById("ant").addEventListener("click", function () { go(-1); });
  document.getElementById("cerrar").addEventListener("click", function () { celu.classList.remove("en-guia"); });
  document.getElementById("ver-clip").addEventListener("click", function () {
    esc.innerHTML = '<div class="capa">' + M.clipHTML() + '</div>'; window.pintarIconos(esc); M.wireClips(esc); esc.querySelector(".clip-play").click();
  });
  /* gestos: deslizar cambia de paso; tocar la mitad derecha avanza */
  var sx = null;
  esc.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
  esc.addEventListener("touchend", function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); sx = null; });
  lista.addEventListener("click", function (e) {
    var t = e.target.closest("[data-sec]"); if (t) open(sections().filter(function (s) { return s.id === t.dataset.sec; })[0]);
    if (e.target.closest("#cambiar")) setDev(dev === "phone" ? "desktop" : "phone");
  });
  function setDev(d) { dev = d; document.querySelectorAll("[data-dev]").forEach(function (b) { b.classList.toggle("elegido", b.dataset.dev === d); }); renderList(); }
  document.querySelectorAll("[data-dev]").forEach(function (b) { b.addEventListener("click", function () { setDev(b.dataset.dev); }); });
  q.addEventListener("input", function () { clearTimeout(q._t); q._t = setTimeout(renderList, 150); });
  renderList();
})();
</script>
</body>
</html>
