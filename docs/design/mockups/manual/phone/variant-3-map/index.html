<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manual · celular · 3 · El mapa</title>
<link rel="stylesheet" href="../../../../common/common.css">
<link rel="stylesheet" href="../../assets/manual.css">
<script src="../../../../common/icons.js"></script>
<script src="../../assets/icons-extra.js"></script>
<script src="../../assets/manual.js"></script>
<script src="../../../../common/navigate.js" defer></script>
<style>
  body { width: 390px; }
  .celu { background: var(--fondo); }
  /* La pantalla de verdad, de fondo: el manual se dibuja encima */
  .fondo-app { position: absolute; left: 0; top: -170px; width: 390px; }
  .fondo-app .captura { border: 0; border-radius: 0; }
  .fondo-app .captura::after { content: ""; position: absolute; inset: 0; background: rgba(26, 29, 27, .30); }
  .fondo-app .pin, .fondo-app .tocar, .fondo-app .globo { z-index: 2; }
  .velo-arriba { position: absolute; z-index: 4; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(180deg, var(--fondo) 55%, rgba(244,242,236,0)); }
  .pin.letra { width: 28px; height: 28px; margin: -14px 0 0 -14px; font-size: 14px; border-color: var(--borde-fuerte); color: var(--texto-2); }

  .pildora { position: absolute; z-index: 5; top: 52px; left: 12px; right: 12px; height: 56px; padding: 0 6px; display: flex; align-items: center; gap: 4px; background: var(--superficie); border-radius: 999px; box-shadow: var(--sombra-3); }
  .pildora .segmentos { flex: 1; }
  .pildora .segmentos > * { flex: 1; justify-content: center; min-height: 36px; padding: 0 8px; }
  .pildora .btn-icono { border-radius: 999px; }
  .pildora .campo { flex: 1; height: 44px; border-radius: 999px; box-shadow: none; }

  .hoja { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; background: var(--superficie); border-radius: var(--r-hoja) var(--r-hoja) 0 0; box-shadow: var(--sombra-3); padding: 8px var(--e4) 34px; }
  .agarre { width: 40px; height: 5px; border-radius: 99px; background: var(--borde-fuerte); margin: 0 auto 12px; }
  .hoja .cab { display: flex; align-items: center; gap: var(--e3); }
  .hoja .cab .pin { position: static; margin: 0; }
  .hoja h2 { margin: var(--e2) 0 4px; }
  .hoja p { margin: 0 0 var(--e4); color: var(--texto-2); font-size: 16px; line-height: 23px; }
  .hoja .fila { display: flex; gap: var(--e2); }
  .hoja .fila .btn-accion { flex: 1; }
  .rutas { display: flex; gap: var(--e2); overflow: hidden; margin: 0 calc(-1 * var(--e4)) var(--e3); padding: 0 var(--e4); }
  .rutas .chip { flex: none; height: 36px; font-size: 14px; }
  .res { padding: var(--e3); border-radius: var(--r); border: 1px solid var(--borde); margin-bottom: var(--e2); }
  .res.marcado { border-color: var(--pino); background: var(--pino-suave); }
  .res .donde { font-size: 14px; font-weight: 700; color: var(--pino-texto); }
  .res .que { font-size: 15px; line-height: 21px; color: var(--texto-2); }
  .res .que b { color: var(--tinta); }
</style>
</head>
<body>
<div class="celu">
  <div class="fondo-app">
    <div class="captura" data-size="780,1688">
      <img src="../../assets/phone-sale.webp" alt="Vender en el celular, de fondo">
      <span class="tocar sin-buscar" data-box="26,1294,754,1386"></span>
      <span class="tocar foco solo-buscar" data-box="576,1296,752,1384"></span>
      <span class="pin ruta" data-at="60,412">1</span>
      <span class="pin ruta" data-at="58,1086">2</span>
      <span class="pin elegido sin-buscar" data-at="40,1300">3</span>
      <span class="pin ruta" data-at="60,1456">4</span>
      <span class="pin letra" data-at="696,412">A</span>
      <span class="pin letra" data-at="700,530">B</span>
      <span class="globo solo-buscar" data-at="300,1220" style="transform:translate(-30%,-100%)"><i class="i i-s" data-i="search"></i>«Fiado» es Cta. cte.</span>
    </div>
  </div>

  <div class="velo-arriba"></div>
  <div class="barra-estado" style="position:relative;z-index:5"><span>10:42</span><span class="se"><i class="i i-s" data-i="wifi"></i><svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="#1A1D1B" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#1A1D1B"/></svg></span></div>

  <div class="pildora sin-buscar" style="--d:flex">
    <button class="btn btn-fantasma btn-icono" data-ir="more" aria-label="Volver"><i class="i" data-i="x"></i></button>
    <div class="segmentos" role="tablist" aria-label="Dispositivo">
      <button><i class="i i-s" data-i="monitor"></i>Compu</button>
      <button class="elegido"><i class="i i-s" data-i="smartphone"></i>Celular</button>
    </div>
    <button class="btn btn-icono btn-suave" aria-label="Buscar"><i class="i" data-i="search"></i></button>
  </div>
  <div class="pildora solo-buscar" style="--d:flex">
    <div class="campo foco"><i class="i" data-i="search"></i><span class="escrito">fiado</span><span class="cursor"></span></div>
    <button class="btn btn-fantasma btn-icono" aria-label="Cerrar la búsqueda"><i class="i" data-i="x"></i></button>
  </div>

  <section class="hoja sin-buscar">
    <div class="agarre"></div>
    <div class="cab"><span class="pin elegido">3</span><span class="t-etiqueta" style="flex:1">Paso 3 de 4</span><button class="btn chico btn-suave">Cobrar una venta<i class="i i-s" data-i="chevron-down"></i></button></div>
    <h2 class="t-seccion">Cómo paga</h2>
    <p>Tocá cómo paga el cliente. «Cta. cte.» es el fiado.</p>
    <div class="fila">
      <button class="btn grande btn-icono" style="width:56px" aria-label="Paso anterior"><i class="i i-l" data-i="arrow-left"></i></button>
      <button class="btn grande btn-icono" style="width:56px" aria-label="Ver el clip, sin sonido"><i class="i i-l" data-i="play"></i></button>
      <button class="btn btn-accion grande">Siguiente</button>
    </div>
  </section>

  <section class="hoja solo-buscar">
    <div class="agarre"></div>
    <div class="t-etiqueta" style="margin-bottom:var(--e3)">«fiado» · 2 lugares en Celular</div>
    <div class="res marcado"><div class="donde">Vender · Cómo paga</div><div class="que"><b>Cta. cte.</b> es el <mark>fiado</mark>: queda a nombre del cliente.</div></div>
    <div class="res"><div class="donde">Vender · A pedido</div><div class="que">Lo que se lleva <mark>fiado</mark> y no está, va «A pedido».</div></div>
  </section>
  <span class="home-ind" style="z-index:7"></span>
</div>
</body>
</html>
