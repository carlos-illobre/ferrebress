# Publica el visor de maquetas (docs/design) en GitHub Pages en cada subida a main que lo toque, con
# las pruebas de campo (tests/field) armadas en field/: GitHub Pages les da HTTPS en cualquier
# dispositivo, que WebRTC y la cámara necesitan.
name: Maquetas
on:
  push:
    branches: [main]
    paths: ["docs/design/**", "tests/field/**", ".github/workflows/mockups.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ferrebress/app
      - run: pnpm --filter @ferrebress/app exec vite build --config ../../tests/field/vite.config.ts
        env:
          FIELD_OUT: ${{ github.workspace }}/docs/design/field
      # El artefacto lleva el número de intento: al volver a correr una ejecución fallida, el
      # artefacto del intento anterior sigue ahí y deploy-pages no sabría cuál usar.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/design
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
