# Publica el visor de maquetas (docs/design) en GitHub Pages en cada subida a main que lo toque.
name: Maquetas
on:
  push:
    branches: [main]
    paths: ["docs/design/**", ".github/workflows/mockups.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/design
      - id: deploy
        uses: actions/deploy-pages@v4
