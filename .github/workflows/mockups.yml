# Publica el visor de maquetas (docs/design) en GitHub Pages en cada subida a main que lo toque.
name: Maquetas
on:
  push:
    branches: [main]
    paths: ["docs/design/**", ".github/workflows/mockups.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # El artefacto lleva el número de intento: al volver a correr una ejecución fallida, el
      # artefacto del intento anterior sigue ahí y deploy-pages no sabría cuál usar.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/design
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
