# Publica el visor de maquetas (docs/design) en GitHub Pages en cada subida a main que lo toque.
name: Maquetas
on:
  push:
    branches: [main]
    paths: ["docs/design/**", ".github/workflows/mockups.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # El artefacto lleva el número de intento: al volver a correr una ejecución fallida, el
      # artefacto del intento anterior sigue ahí y deploy-pages no sabría cuál usar.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/design
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
