# Despliegue (ADR-014): cuando el control de una subida a main termina bien, construye las dos
# imágenes para ARM, las publica en GHCR con el commit y manda un aviso vacío a ntfy. La
# máquina no recibe nada más: le pregunta a GitHub qué desplegar. El canal de ntfy es un
# secreto, así no aparece en los registros públicos.
name: Despliegue
on:
  workflow_run:
    workflows: [Control]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          build-args: VERSION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  notify:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "Falta el secreto NTFY_TOPIC: la máquina se entera en su próxima verificación."; exit 0; }
          curl -sf -d "nueva versión" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
