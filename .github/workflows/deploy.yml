# Despliegue (ADR-014): cuando el control de una subida a main termina bien, construye las dos
# imágenes para ARM, las publica en GHCR con el commit y manda un aviso vacío a ntfy. La
# máquina no recibe nada más: le pregunta a GitHub qué desplegar. El canal de ntfy es un
# secreto, así no aparece en los registros públicos.
name: Despliegue
on:
  workflow_run:
    workflows: [Control]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          build-args: VERSION=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  notify:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "Falta el secreto NTFY_TOPIC: la máquina se entera en su próxima verificación."; exit 0; }
          curl -sf -d "nueva versión" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
