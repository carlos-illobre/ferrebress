# Ferrebress en la máquina (ADR-010, ADR-014). Las imágenes las fija deploy.sh por su huella; la de
# PostgreSQL, este archivo. Ningún proceso puede ganar privilegios adentro de su contenedor.
name: ferrebress
# Los registros de cada servicio, con tope: un pedido repetido no puede llenar el disco de la VM.
x-logging: &logging
  options: { max-size: 10m, max-file: "3" }
services:
  web:
    image: ${WEB_IMAGE:?falta WEB_IMAGE}
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:${WEB_PORT:?falta WEB_PORT}:80"]
    depends_on:
      server: { condition: service_healthy }
    networks:
      internal: { ipv4_address: 172.30.0.10 }
  server:
    image: ${SERVER_IMAGE:?falta SERVER_IMAGE}
    restart: unless-stopped
    logging: *logging
    # El servidor corre como el usuario node y no necesita ningún permiso del sistema.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file: .env
    environment:
      PORT: "3000"
      AUDIT_PATH: /data/audit
      TRUSTED_PROXY: 172.30.0.10
    volumes:
      - audit-data:/data/audit
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ferrebress
      POSTGRES_USER: ferrebress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ferrebress"]
      interval: 5s
      retries: 12
    networks: [internal]
volumes:
  db-data:
  audit-data:
networks:
  internal:
    ipam:
      # Las direcciones automáticas van de .128 en adelante; .10 queda fija para el Caddy.
      config: [{ subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25 }]
