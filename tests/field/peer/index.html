<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de la conexión directa</title>
    <style>
      body { font: 16px/1.4 system-ui, sans-serif; margin: 0 auto; max-width: 640px; padding: 16px; background: #f6f4ef; color: #222; }
      button { font: inherit; padding: 12px 16px; border-radius: 10px; border: 1px solid #bbb; background: #fff; margin: 4px 4px 4px 0; }
      #roles button { display: block; width: 100%; font-size: 18px; }
      #qr svg { width: 100%; max-width: 360px; height: auto; background: #fff; }
      video { width: 100%; max-width: 360px; background: #000; }
      textarea { width: 100%; font: 12px monospace; }
      pre { white-space: pre-wrap; font: 12px/1.5 monospace; background: #fff; padding: 8px; border-radius: 8px; }
      .ok { color: #11733b; font-weight: 700; font-size: 20px; }
      .bad { color: #b3261e; font-weight: 700; font-size: 20px; }
      details { margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Prueba de la conexión directa</h1>
    <p>Abrila en la notebook y en el celular, los dos en el Wi-Fi del local.</p>
    <div id="roles">
      <button type="button" id="computer">Soy la computadora</button>
      <button type="button" id="phone">Soy el celular</button>
    </div>
    <p id="step"></p>
    <div id="give" hidden>
      <div id="qr"></div>
      <details>
        <summary>El texto del código</summary>
        <textarea id="own" rows="4" readonly></textarea>
        <button type="button" id="copy-own">Copiar el texto</button>
      </details>
    </div>
    <button type="button" id="read" hidden>Leer el código del otro</button>
    <div id="take" hidden><video id="video" playsinline muted></video></div>
    <details>
      <summary>Pegar el texto del otro (si la cámara no lo lee)</summary>
      <textarea id="paste" rows="4"></textarea>
      <button type="button" id="paste-go">Usar el texto pegado</button>
    </details>
    <p id="result"></p>
    <button type="button" id="copy">Copiar el resultado</button>
    <pre id="log"></pre>
    <script type="module" src="./peer.ts"></script>
  </body>
</html>
